[workspace]
resolver = "2"
members = ["crates/audio", "crates/motor", "crates/servidor", "crates/show", "crates/video"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/marcoldmusica-cyber/otaconvert"

[profile.release]
# Errores de pánico visibles en el registro, sin símbolos de depuración enormes.
debug = "line-tables-only"
