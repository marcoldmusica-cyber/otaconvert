[package]
name = "otaconvert-motor"
description = "Motor de audio y vídeo de Otaconvert V2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# "realtime": el hilo de audio pide prioridad de tiempo real a Windows (MMCSS).
cpal = { version = "0.18.2", features = ["realtime"] }
otaconvert-audio = { path = "../audio" }
otaconvert-servidor = { path = "../servidor" }
otaconvert-show = { path = "../show" }
otaconvert-video = { path = "../video" }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Datos de versión, icono y manifiesto dentro del exe (los pide la firma
# de código de SignPath y ayudan a que Windows sepa qué programa es).
winresource = "0.1.34"
