[package]
name = "otaconvert-lanzador"
description = "Otaconvert V2: abre el programa sin ventana de consola"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# En los paquetes se llama "Otaconvert.exe": es lo que toca el usuario. Abre el
# motor (otaconvert-motor.exe) sin consola, guarda sus mensajes en un archivo,
# avisa si falta WebView2 (con su instalador incluido) y muestra los errores
# en una ventana normal.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"
