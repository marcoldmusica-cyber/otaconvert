<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otaconvert</title>
<!-- Interfaz (etapas 3B y 3C): el boceto aprobado (v2/diseno/boceto-pantalla-principal.html)
     conectado al motor por el canal seguro. Todos los textos vienen de ui/textos.json
     (español e inglés, probados en tests/textos.rs): aquí se usan con la función T,
     y los atributos data-t, data-help (Modo Ayuda) y data-consejo (consejos).
     Lo que todavía no funciona aparece en gris con "Próximamente". Los textos del show
     se ponen siempre con textContent: nunca como HTML. -->
<style>
:root{
  color-scheme:dark;
  --bg:#0E1117;--card:#151921;--card2:#1B2029;--hover:#252B37;--border:#262C38;
  --text:#E9ECF2;--muted:#9098A8;--dim:#5D6677;
  --accent:#6F80FF;--accent-h:#5C6DEE;--ok:#58D69A;--err:#F27A74;--warn:#F2C46B;--on-accent:#0E1117;
  --font:"Segoe UI","SF Pro Display",system-ui,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
:root[data-tema="noche"]{
  --bg:#080404;--card:#100909;--card2:#160C0C;--hover:#211212;--border:#2A1515;
  --text:#D08A80;--muted:#8E5850;--dim:#5E3833;
  --accent:#B9463B;--accent-h:#A13C33;--ok:#B9463B;--err:#E0584C;--warn:#C0674E;--on-accent:#080404;
}
:root[data-tema="contraste"]{
  --bg:#000000;--card:#000000;--card2:#0D0D10;--hover:#1E1F26;--border:#BFC6D4;
  --text:#FFFFFF;--muted:#E1E5EC;--dim:#B8BECA;
  --accent:#8C9BFF;--accent-h:#A4B0FF;--ok:#6EF0AE;--err:#FF8A84;--warn:#FFD27A;--on-accent:#000000;
}
:root[data-tema="dia"]{
  color-scheme:light;
  --bg:#FFFFFF;--card:#F2F4F8;--card2:#E6EAF1;--hover:#D9DFE9;--border:#A9B2C1;
  --text:#05070C;--muted:#2E3543;--dim:#535B6B;
  --accent:#2A3FD9;--accent-h:#2033BD;--ok:#0B7340;--err:#C0261D;--warn:#8F5A00;--on-accent:#FFFFFF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:12px var(--mono);background:var(--card2);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--text)}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column;gap:12px;padding:8px 16px 10px}

/* Barra de menús */
.menubar{display:flex;align-items:center;gap:2px;margin:0 0 -6px;padding:0 2px}
.mb{position:relative}
.mb>button{background:none;border:0;border-radius:8px;padding:5px 10px;color:var(--muted);font-size:13px}
.mb>button:hover,.mb>button[aria-expanded="true"]{background:var(--hover);color:var(--text)}
.menu{position:absolute;left:0;top:calc(100% + 4px);z-index:25;min-width:250px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.menu button{background:none;border:0;text-align:left;padding:8px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu button:disabled{opacity:.45}
.menu button[aria-checked="true"]::after{content:"✓";color:var(--accent)}
.menu kbd{font-size:11px;padding:0 5px}
.menu .sep{height:1px;background:var(--border);margin:4px 6px}
.menu .lbl{font-size:12px;color:var(--dim);padding:6px 12px 2px}
.pronto{font-size:11px;color:var(--dim)}

/* Cabecera */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.bars{display:flex;align-items:center;gap:3px;height:22px}
.bars i{display:block;width:4px;border-radius:2px;background:var(--accent);height:calc(var(--h)*100%);transform-origin:center}
.busy .bars i{animation:ola 1s ease-in-out infinite;animation-delay:calc(var(--d)*-0.17s)}
@keyframes ola{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.busy .bars i{animation:none}}
.show-name{display:flex;flex-direction:column;min-width:0}
.show-name strong{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-name span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.tabs button{background:none;border:0;border-radius:9px;padding:6px 14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card2);color:var(--text)}
.tabs button:disabled{opacity:.45}
.spacer{flex:1}
.modes{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:5px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
.chip.on .dot{background:var(--ok)}
.chip.warn .dot{background:var(--warn)}
.clock{font:600 15px var(--mono);color:var(--text)}
.btn{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:7px 12px}
.btn:hover{background:var(--hover)}

/* Aviso */
.aviso{display:flex;align-items:center;gap:12px;background:var(--card2);border-left:3px solid var(--warn);border-radius:0 12px 12px 0;padding:8px 8px 8px 12px}
.aviso p{margin:0;flex:1}
.aviso button{background:none;border:0;color:var(--muted);border-radius:8px;padding:4px 8px}
.aviso button:hover{background:var(--hover);color:var(--text)}

/* Cuerpo */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--muted);font-size:13px}
.panel-h strong{color:var(--text);font-weight:600;font-size:14px}

/* Lista de cues */
.list{overflow:auto;flex:1;padding:6px}
.row{display:grid;grid-template-columns:40px 22px minmax(0,1fr) 92px 64px;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;position:relative;border:1px solid transparent}
.edicion .row{cursor:pointer}
.edicion .row:hover{background:var(--hover)}
.row .n{color:var(--dim);font:13px var(--mono);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row svg{width:20px;height:20px;color:var(--muted)}
.row .nm{min-width:0}
.row .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .out{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .du{font:13px var(--mono);color:var(--muted);text-align:right}
.row.standby{border-color:var(--accent);background:var(--card2)}
.row.standby .n{color:var(--accent);font-weight:700}
.row.standby::before{content:"";position:absolute;left:-1px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.row.playing svg,.row.playing .nm div{color:var(--ok)}
.row .prog{position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:var(--border);overflow:hidden}
.row .prog i{display:block;height:100%;background:var(--ok)}
.tag{font-size:11px;color:var(--dim);margin-left:6px}
.prep{font-size:11px;margin-left:6px;color:var(--dim)}
.prep.listo{color:var(--ok)}
.prep.error{color:var(--err)}
.lock{font-size:11px;color:var(--warn);margin-left:6px}
.vacio{color:var(--muted);text-align:center;padding:40px 16px}

/* Panel lateral: Edición */
.props{overflow:auto;flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;gap:10px}
.field label,.field .k{color:var(--muted);font-size:13px}
.field input[type=text],.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--text);font:inherit}
.field textarea{resize:vertical;min-height:54px}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.val{font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inline{display:flex;align-items:center;gap:10px;min-width:0}
.inline input[type=range]{flex:1;min-width:0}
.inline .val{flex:none;min-width:72px;text-align:right}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;min-width:0}
fieldset:disabled{opacity:.45}
.locked{background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--border));border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.locked p{margin:0}
.locked small{color:var(--muted)}
.note-small{font-size:12px;color:var(--dim)}

/* Panel lateral: Función */
.live{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.big{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.big .k{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.big .t{font-size:26px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.big .meta{color:var(--muted);font-size:13px;white-space:pre-wrap}
.big.now .t{color:var(--ok)}
.big.next{border-color:var(--accent)}
.remain{font:600 34px var(--mono)}
.bigbar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.bigbar i{display:block;height:100%;background:var(--ok)}
.nowlist{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--dim)}
.pausado{color:var(--warn);font-weight:600}

/* Transporte */
.transport{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
.go{min-height:76px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:30px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:16px;transition:background .15s,transform .05s;min-width:0}
.go:hover{background:var(--accent-h)}
.go:active{transform:scale(.99)}
.go small{font-size:13px;font-weight:500;letter-spacing:0;opacity:.75;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tb{border-radius:16px;border:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;min-height:76px}
.tb:hover{background:var(--hover)}
.tb span{font-weight:600}
.tb kbd{font-size:11px}
.tb[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
.panic{background:color-mix(in srgb,var(--err) 16%,var(--card));border-color:color-mix(in srgb,var(--err) 55%,var(--border));color:var(--err)}
.panic:hover{background:color-mix(in srgb,var(--err) 26%,var(--card))}

.credito{color:var(--dim);font-size:11px;text-align:right;margin-top:-6px}

/* Ventanitas (Acerca de, Atajos) */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40;padding:16px}
.dlg{background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:20px 22px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.dlg h2{margin:0;font-size:18px;font-weight:600}
.dlg p{margin:0;color:var(--muted)}
.dlg .accent{color:var(--accent);font-weight:600}
.dlg table{border-collapse:collapse;width:100%}
.dlg td{padding:5px 4px;border-bottom:1px solid var(--border)}
.dlg td:first-child{white-space:nowrap;width:1%}
.dlg .ok{align-self:flex-end;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:8px 18px;font-weight:600}
.dlg .bars{height:40px;gap:5px}
.dlg .bars i{width:7px;border-radius:4px}

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .body,.transport{grid-template-columns:1fr}
  .list{max-height:420px}
  .row{grid-template-columns:34px 20px minmax(0,1fr) 54px}
  .row .out{display:none}
  .spacer{display:none}
}

/* Etapa 3C: consejos, Modo Ayuda, Primeros pasos */
.q{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;padding:0;vertical-align:middle;line-height:1}
.q:hover,.q[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.sin-consejos .q{display:none}
.field label{display:flex;align-items:center}
.globo{position:fixed;z-index:50;width:min(340px,calc(100% - 32px));background:var(--card2);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:6px;font-size:13px;pointer-events:none}
.globo h3{margin:0;font-size:14px;font-weight:600}
.globo p{margin:0;color:var(--text)}
.globo .k{color:var(--accent);font-weight:600;font-size:12px;margin-top:2px}
.globo .ej{color:var(--muted);font-style:italic}
.helpbar{display:none;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 14%,var(--card));border:1px solid var(--accent);border-radius:14px;padding:10px 14px}
.helpbar p{margin:0;font-size:15px}
.helping .helpbar{display:flex}
.helping [data-help]{outline:2px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px;cursor:help}
.helping [data-help]:hover{outline-style:solid}
.helping [data-help] *{cursor:help}
.burbuja{position:fixed;z-index:45;width:min(360px,calc(100% - 32px));background:var(--card2);border:1px solid var(--accent);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px}
.burbuja h3{margin:0;font-size:16px;font-weight:600}
.burbuja p{margin:0;font-size:15px;line-height:1.5}
.burbuja .ok,.dlg .nav button{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:6px 14px;font-weight:600;align-self:flex-end}
.dlg .nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg .nav .atras{background:var(--card);color:var(--text);border:1px solid var(--border)}
.dlg .nav span{color:var(--dim);font-size:12px}
.menu .q{margin-left:auto}
</style>
</head>
<body>
<div class="app edicion" id="app">
  <nav class="menubar" role="menubar" data-help="menubar">
    <div class="mb">
      <button aria-haspopup="true" aria-expanded="false" data-menu data-t="archivo"></button>
      <div class="menu" role="menu" hidden>
        <button role="menuitem" disabled><span data-t="nuevo_show"></span> <span class="pronto" data-t="proximamente"></span></button>
        <button role="menuitem" disabled><span data-t="abrir"></span> <span class="pronto" data-t="proximamente"></span></button>
        <button role="menuitem" disabled><span data-t="abrir_reciente"></span> <span class="pronto" data-t="proximamente"></span></button>
        <div class="sep"></div>
        <button role="menuitem" data-orden="guardar"><span data-t="guardar"></span> <kbd>Ctrl S</kbd></button>
        <button role="menuitem" disabled><span data-t="guardar_como"></span> <span class="pronto" data-t="proximamente"></span></button>
        <button role="menuitem" disabled><span data-t="reunir_medios"></span> <span class="pronto" data-t="proximamente"></span></button>
      </div>
    </div>
    <div class="mb">
      <button aria-haspopup="true" aria-expanded="false" data-menu data-t="edicion_menu"></button>
      <div class="menu" role="menu" hidden>
        <button role="menuitem" disabled><span data-t="deshacer"></span> <span class="pronto" data-t="proximamente"></span></button>
        <button role="menuitem" disabled><span data-t="rehacer"></span> <span class="pronto" data-t="proximamente"></span></button>
        <div class="sep"></div>
        <button role="menuitem" disabled><span data-t="copiar"></span> <span class="pronto" data-t="proximamente"></span></button>
        <button role="menuitem" disabled><span data-t="pegar"></span> <span class="pronto" data-t="proximamente"></span></button>
        <button role="menuitem" disabled><span data-t="eliminar_cue"></span> <span class="pronto" data-t="proximamente"></span></button>
        <div class="sep"></div>
        <button role="menuitem" disabled><span data-t="ajustes_show"></span> <span class="pronto" data-t="proximamente"></span></button>
      </div>
    </div>
    <div class="mb">
      <button aria-haspopup="true" aria-expanded="false" data-menu data-t="vista"></button>
      <div class="menu" role="menu" hidden>
        <button role="menuitem" disabled><span data-t="personalizar"></span> <span class="pronto" data-t="proximamente"></span></button>
        <div class="sep"></div>
        <button role="menuitemcheckbox" data-tema="noche" data-consejo="modo_noche" aria-checked="false"><span data-t="modo_noche"></span><span class="q" aria-hidden="true">?</span></button>
        <button role="menuitemcheckbox" data-tema="dia" data-consejo="modo_dia" aria-checked="false"><span data-t="modo_dia"></span><span class="q" aria-hidden="true">?</span></button>
        <button role="menuitemcheckbox" data-tema="contraste" data-consejo="alto_contraste" aria-checked="false"><span data-t="alto_contraste"></span><span class="q" aria-hidden="true">?</span></button>
        <div class="sep"></div>
        <div class="lbl" data-t="idioma"></div>
        <button role="menuitemradio" data-idioma="es" aria-checked="true">Español</button>
        <button role="menuitemradio" data-idioma="en" aria-checked="false">English</button>
        <div class="sep"></div>
        <button role="menuitem" data-accion="restaurar" data-t="restaurar_vista"></button>
      </div>
    </div>
    <div class="mb">
      <button aria-haspopup="true" aria-expanded="false" data-menu data-t="ayuda"></button>
      <div class="menu" role="menu" hidden>
        <button role="menuitemcheckbox" data-accion="modo_ayuda" aria-checked="false"><span data-t="modo_ayuda"></span> <kbd>H</kbd></button>
        <button role="menuitem" data-accion="pasos" data-t="primeros_pasos"></button>
        <!-- Esta casilla nunca se oculta: siempre se pueden volver a encender los consejos. -->
        <button role="menuitemcheckbox" data-accion="consejos" data-consejo="mostrar_consejos" aria-checked="true"><span data-t="mostrar_consejos"></span></button>
        <div class="sep"></div>
        <button role="menuitem" data-accion="atajos" data-t="atajos"></button>
        <div class="sep"></div>
        <button role="menuitem" data-accion="acerca" data-t="acerca"></button>
      </div>
    </div>
  </nav>

  <div class="helpbar" role="status"><p data-t="ayuda_barra"></p><button class="btn" id="salirAyuda" data-t="salir_ayuda"></button></div>

  <header class="top" id="top">
    <div class="brand">
      <div class="bars" aria-hidden="true"><i style="--h:.38;--d:0"></i><i style="--h:.72;--d:1"></i><i style="--h:1;--d:2"></i><i style="--h:.58;--d:3"></i><i style="--h:.84;--d:4"></i><i style="--h:.46;--d:5"></i></div>
      <div class="show-name"><strong id="nombre">Otaconvert</strong><span id="subtitulo"></span></div>
    </div>
    <div class="tabs" role="tablist" data-help="pestanas">
      <button role="tab" aria-selected="true" data-t="pestana_show"></button>
      <button role="tab" aria-selected="false" disabled data-t="pestana_convertir" data-t-title="proximamente"></button>
    </div>
    <div class="spacer"></div>
    <div class="modes" data-help="modos">
      <div class="seg" role="group" id="segModo">
        <button id="mEdicion" aria-pressed="true" data-t="edicion"></button>
        <button id="mFuncion" aria-pressed="false" data-t="funcion"></button>
      </div>
      <kbd>Tab</kbd>
    </div>
    <div class="chip" id="conexion" data-help="conexion"><span class="dot"></span><span id="conexion-texto"></span></div>
    <div class="clock num" id="reloj" data-help="reloj">00:00:00</div>
  </header>

  <div class="aviso" id="aviso" role="status" data-help="aviso" hidden><p id="aviso-texto"></p><button id="aviso-cerrar">✕</button></div>

  <main class="body">
    <section class="panel" data-help="lista">
      <div class="panel-h"><strong data-t="cues"></strong><span id="info" class="num"></span></div>
      <div class="list" id="lista"></div>
    </section>
    <section class="panel" id="lado" data-help="lado_edicion"></section>
  </main>

  <footer class="transport">
    <button class="go" id="go" data-help="go">GO <small id="goNext"></small></button>
    <div class="side-btns">
      <button class="tb" id="pausa" aria-pressed="false" data-help="pausa"><span data-t="pausa"></span><kbd>P</kbd></button>
      <button class="tb" id="fundir" data-help="fundir"><span data-t="fundir_todo"></span><kbd>F</kbd></button>
      <button class="tb panic" id="parar" data-help="parar"><span data-t="parar_todo"></span><kbd>Esc</kbd></button>
    </div>
  </footer>
  <div class="credito" data-t="credito" data-t-title="credito_titulo"></div>
</div>

<script>
(function () {
  "use strict";
  // Textos en español e inglés: los pone el motor al servir la página (ui/textos.json).
  var TEXTOS = "__TEXTOS__";
  var token = new URLSearchParams(location.search).get("t") || "";
  var ws = null, abierto = false, e = null;
  var desbloqueado = null;   // cue que se puede editar aunque suene
  var ladoClave = "";        // qué muestra el panel lateral (para no redibujar mientras se escribe)
  var $ = function (id) { return document.getElementById(id); };

  // ---- Preferencias de esta ventana (pasarán a los perfiles de operador) ----
  function leer(k, def) { try { var v = localStorage.getItem(k); return v === null ? def : v; } catch (x) { return def; } }
  function escribir(k, v) { try { localStorage.setItem(k, v); } catch (x) {} }
  var idioma = leer("ota-idioma", "es") === "en" ? "en" : "es";
  var consejos = leer("ota-consejos", "si") !== "no";
  var tema = leer("ota-tema", "");

  // ---- Textos ----
  function T(k, vars) {
    var s = (TEXTOS[idioma] && TEXTOS[idioma].ui[k]) || (TEXTOS.es.ui[k]) || k;
    if (vars) for (var v in vars) s = s.split("{" + v + "}").join(vars[v]);
    return s;
  }
  function ayudaDe(k) { return TEXTOS[idioma].ayuda[k]; }
  function aplicarTextos() {
    document.documentElement.lang = idioma;
    document.querySelectorAll("[data-t]").forEach(function (x) { x.textContent = T(x.dataset.t); });
    document.querySelectorAll("[data-t-title]").forEach(function (x) { x.title = T(x.dataset.tTitle); });
    $("segModo").setAttribute("aria-label", T("modo_grupo"));
    $("lista").setAttribute("aria-label", T("lista_cues"));
    $("aviso-cerrar").setAttribute("aria-label", T("cerrar_aviso"));
    document.querySelectorAll("[data-idioma]").forEach(function (b) { b.setAttribute("aria-checked", String(b.dataset.idioma === idioma)); });
    if (!abierto) avisoConexion(T("conectando"), "");
    else avisoConexion(T("conectado"), "on");
    ladoClave = "";
    if (e) dibujar();
  }

  // ---- Ayudantes para crear elementos sin HTML ----
  function el(tag, cls, texto) {
    var x = document.createElement(tag);
    if (cls) x.className = cls;
    if (texto != null) x.textContent = texto;
    return x;
  }
  var SVG = "http://www.w3.org/2000/svg";
  function icono(tipo) {
    var s = document.createElementNS(SVG, "svg");
    s.setAttribute("viewBox", "0 0 20 20"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "1.7"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("aria-hidden", "true");
    var d = { audio: ["M3 9v2M6.5 6v8M10 3v14M13.5 7v6M17 9v2"],
              video: ["M4.5 4.5h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z", "M8.5 7.8v4.4l3.8-2.2z"],
              imagen: ["M4.5 4.5h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z", "M4.5 13.5l4-4 3 3 2-2 2 2"] }[tipo] || [];
    d.forEach(function (p) { var q = document.createElementNS(SVG, "path"); q.setAttribute("d", p); s.appendChild(q); });
    return s;
  }
  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function tipoTexto(t) { return T({ audio: "audio", video: "video", imagen: "imagen" }[t] || "audio"); }
  function salidaTexto(s) { return s === "Auriculares" ? T("auriculares") : T("principal"); }
  function prepTexto(p) { return { listo: T("listo"), preparando: T("preparando"), error: T("no_reproducible") }[p] || ""; }

  function mandar(orden, extra) {
    if (!abierto) return;
    var m = { orden: orden };
    if (extra) for (var k in extra) m[k] = extra[k];
    ws.send(JSON.stringify(m));
  }

  // ---- Dibujo ----
  function sonandoPorCue() {
    var m = {};
    (e.sonando || []).forEach(function (s) { if (!m[s.cue] || !s.fundiendo) m[s.cue] = s; });
    return m;
  }

  function dibujar() {
    var funcion = e.modo === "funcion";
    $("app").classList.toggle("edicion", !funcion);
    $("mEdicion").setAttribute("aria-pressed", String(!funcion));
    $("mFuncion").setAttribute("aria-pressed", String(funcion));
    $("nombre").textContent = e.show || "Otaconvert";
    document.title = (e.show ? e.show + " · " : "") + "Otaconvert";
    $("subtitulo").textContent = T("n_cues", { n: e.cues.length }) + " · " + (e.sucio ? T("sin_guardar") : T("guardado"));
    $("top").classList.toggle("busy", (e.sonando || []).length > 0 && !e.pausado);
    $("aviso").hidden = !e.aviso;
    $("aviso-texto").textContent = e.aviso || "";
    $("pausa").setAttribute("aria-pressed", String(!!e.pausado));
    var nx = e.cues[e.en_espera];
    $("goNext").textContent = nx ? nx.numero + " · " + nx.nombre : T("fin_lista");
    if (!e.con_sonido) avisoConexion(T("sin_sonido"), "warn");
    else if (!e.con_proyeccion) avisoConexion(T("sin_proyeccion"), "warn");
    $("lado").dataset.help = funcion ? "lado_funcion" : "lado_edicion";
    dibujarLista();
    dibujarLado(funcion);
  }

  function dibujarLista() {
    var lista = $("lista"), arriba = lista.scrollTop;
    var son = sonandoPorCue();
    lista.textContent = "";
    $("info").textContent = T("n_cues", { n: e.cues.length }) + " · " + T("n_sonando", { n: (e.sonando || []).length });
    if (!e.cues.length) { lista.appendChild(el("div", "vacio", T("vacio"))); return; }
    var funcion = e.modo === "funcion";
    e.cues.forEach(function (c, i) {
      var s = son[i];
      var f = el("div", "row" + (i === e.en_espera ? " standby" : "") + (s ? " playing" : ""));
      f.dataset.i = i;
      if (!funcion) f.tabIndex = 0;
      f.appendChild(el("span", "n", c.numero));
      f.appendChild(icono(c.tipo));
      var nm = el("span", "nm"), linea = el("div");
      linea.appendChild(document.createTextNode(c.nombre));
      if (c.bucle) linea.appendChild(el("span", "tag", T("bucle")));
      if (c.preparacion) {
        var pr = el("span", "prep " + c.preparacion, prepTexto(c.preparacion));
        if (c.error) pr.title = c.error;
        linea.appendChild(pr);
      }
      if (s && !funcion && desbloqueado !== i) linea.appendChild(el("span", "lock", T("sonando_tag")));
      nm.appendChild(linea);
      nm.appendChild(el("small", "", c.nota || c.archivo));
      f.appendChild(nm);
      f.appendChild(el("span", "out", c.tipo === "audio" ? salidaTexto(c.salida) : T("proyector")));
      f.appendChild(el("span", "du num", c.tipo === "imagen" ? "—" : (c.duracion_s != null ? mmss(c.duracion_s) : "")));
      if (s) { var p = el("span", "prog"), b = el("i"); b.style.width = (s.progreso * 100) + "%"; p.appendChild(b); f.appendChild(p); }
      lista.appendChild(f);
    });
    lista.scrollTop = arriba;
    var sb = lista.querySelector(".standby");
    if (sb) sb.scrollIntoView({ block: "nearest" });
  }

  // Botoncito "?" con el consejo de una opción (regla de interfaz de CLAUDE.md).
  function botonConsejo(k) {
    var b = el("button", "q", "?");
    b.type = "button";
    b.dataset.consejo = k;
    b.setAttribute("aria-label", T("consejo_boton"));
    b.setAttribute("aria-expanded", "false");
    return b;
  }

  // Panel lateral. En Edición: el cue en espera, editable. En Función: lo que suena y lo que viene.
  function dibujarLado(funcion) {
    var lado = $("lado");
    if (funcion) { ladoClave = ""; dibujarEnVivo(lado); return; }
    var i = e.en_espera, c = e.cues[i];
    var suena = !!sonandoPorCue()[i];
    var clave = JSON.stringify([i, c, suena, desbloqueado, idioma, consejos]);
    // No se redibuja mientras se escribe en el panel: se perdería lo escrito.
    if (clave === ladoClave || lado.contains(document.activeElement) && document.activeElement.matches("input[type=text],textarea")) return;
    ladoClave = clave;
    lado.textContent = "";
    var h = el("div", "panel-h");
    if (!c) {
      h.appendChild(el("strong", "", T("fin_lista")));
      lado.appendChild(h);
      var v = el("div", "props"); v.appendChild(el("p", "empty", T("sin_espera"))); lado.appendChild(v);
      return;
    }
    h.appendChild(el("strong", "", T("cue_tipo", { n: c.numero, tipo: tipoTexto(c.tipo) })));
    h.appendChild(el("span", "", suena ? T("sonando") : c.preparacion === "listo" ? T("preparado_memoria") : prepTexto(c.preparacion)));
    lado.appendChild(h);
    var props = el("div", "props");
    var bloqueado = suena && desbloqueado !== i;
    if (bloqueado) {
      var lk = el("div", "locked"), t = el("div");
      t.appendChild(el("p", "", T("bloqueado_t")));
      t.appendChild(el("small", "", T("bloqueado_s")));
      var u = el("button", "btn", T("editar_igualmente"));
      u.onclick = function () { desbloqueado = i; ladoClave = ""; dibujarLado(false); dibujarLista(); };
      lk.appendChild(t); lk.appendChild(u); props.appendChild(lk);
    }
    var fs = el("fieldset"); fs.disabled = bloqueado;
    function editar(cambios) { mandar("editar_cue", { cue: i, cambios: cambios, forzar: desbloqueado === i }); }
    function campo(clave, control, id, consejo) {
      var f = el("div", "field"), l = el("label", "", T(clave));
      if (id) { control.id = id; l.htmlFor = id; }
      if (consejo) l.appendChild(botonConsejo(consejo));
      f.appendChild(l); f.appendChild(control); return f;
    }
    var nombre = el("input"); nombre.type = "text"; nombre.value = c.nombre; nombre.maxLength = 200;
    nombre.onchange = function () { editar({ nombre: nombre.value }); };
    fs.appendChild(campo("nombre", nombre, "fNombre"));
    var nota = el("textarea"); nota.value = c.nota; nota.maxLength = 2000; nota.rows = 2;
    nota.placeholder = T("nota_ph");
    nota.onchange = function () { editar({ nota: nota.value }); };
    fs.appendChild(campo("nota", nota, "fNota", "nota"));
    var arch = el("div", "field"); arch.appendChild(el("span", "k", T("archivo_campo"))); arch.appendChild(el("span", "val", c.archivo)); arch.title = c.archivo;
    fs.appendChild(arch);
    if (c.tipo === "audio") {
      var sal = el("select");
      ["Principal", "Auriculares"].forEach(function (o) { var op = el("option", "", salidaTexto(o)); op.value = o; op.selected = o === c.salida; sal.appendChild(op); });
      sal.onchange = function () { editar({ salida: sal.value }); };
      fs.appendChild(campo("salida", sal, "fSalida", "salida"));
      var vol = el("input"); vol.type = "range"; vol.min = -60; vol.max = 12; vol.step = 0.5; vol.value = c.volumen_db;
      var vv = el("span", "val num", fmtDb(c.volumen_db));
      vol.oninput = function () { vv.textContent = fmtDb(+vol.value); };
      vol.onchange = function () { editar({ volumen_db: +vol.value }); };
      var w = el("div", "inline"); w.appendChild(vol); w.appendChild(vv);
      var fv = campo("volumen", w, null, "volumen"); fv.querySelector("label").htmlFor = "fVol"; vol.id = "fVol";
      fs.appendChild(fv);
      fs.appendChild(campo("fundido_inicial", selFundido(c.fundido_entrada_ms, function (ms) { editar({ fundido_entrada_ms: ms }); }), "fIn", "fundido_entrada"));
      fs.appendChild(campo("fundido_final", selFundido(c.fundido_salida_ms, function (ms) { editar({ fundido_salida_ms: ms }); }), "fOut", "fundido_salida"));
      var tg = el("label", "toggle"), cb = el("input"); cb.type = "checkbox"; cb.checked = c.bucle;
      cb.onchange = function () { editar({ bucle: cb.checked }); };
      tg.appendChild(cb); tg.appendChild(document.createTextNode(T("repetir_bucle"))); tg.appendChild(botonConsejo("bucle"));
      fs.appendChild(tg);
      if (c.duracion_s != null) fs.appendChild(el("p", "note-small", T("duracion", { d: mmss(c.duracion_s) }) + (c.bucle ? T("por_vuelta") : "")));
      fs.appendChild(el("p", "note-small", T("onda_pronto")));
    } else {
      if (c.tipo === "video") {
        var tgv = el("label", "toggle"), cbv = el("input"); cbv.type = "checkbox"; cbv.checked = c.bucle;
        cbv.onchange = function () { editar({ bucle: cbv.checked }); };
        tgv.appendChild(cbv); tgv.appendChild(document.createTextNode(T("repetir_bucle"))); tgv.appendChild(botonConsejo("bucle"));
        fs.appendChild(tgv);
        if (c.duracion_s != null) fs.appendChild(el("p", "note-small", T("duracion", { d: mmss(c.duracion_s) }) + (c.bucle ? T("por_vuelta") : "")));
      }
      fs.appendChild(el("p", "note-small", c.tipo === "video" ? T("video_pronto") : T("proyector")));
    }
    props.appendChild(fs);
    lado.appendChild(props);
  }
  function fmtDb(x) {
    var s = (x > 0 ? "+" : "") + (+x).toFixed(1);
    return (idioma === "es" ? s.replace(".", ",") : s) + " dB";
  }
  function selFundido(ms, cambio) {
    var s = el("select"), opciones = [0, 500, 1000, 1500, 2000, 3000, 4000, 5000, 6000, 8000, 10000];
    if (opciones.indexOf(ms) < 0) { opciones.push(ms); opciones.sort(function (a, b) { return a - b; }); }
    opciones.forEach(function (v) {
      var seg = String(v / 1000); if (idioma === "es") seg = seg.replace(".", ",");
      var o = el("option", "", v === 0 ? T("sin_fundido") : seg + " s"); o.value = v; o.selected = v === ms; s.appendChild(o);
    });
    s.onchange = function () { cambio(+s.value); };
    return s;
  }

  function dibujarEnVivo(lado) {
    lado.textContent = "";
    var h = el("div", "panel-h"); h.appendChild(el("strong", "", T("en_vivo"))); h.appendChild(el("span", "", T("nada_cambiar")));
    lado.appendChild(h);
    var live = el("div", "live"), now = el("div", "nowlist");
    if (e.pausado) now.appendChild(el("div", "pausado", T("en_pausa")));
    var lista = e.sonando || [];
    if (!lista.length) {
      var b = el("div", "big now"), k = el("div", "k"); k.appendChild(el("span", "", T("sonando"))); b.appendChild(k);
      b.appendChild(el("div", "empty", T("nada_reproduccion"))); now.appendChild(b);
    }
    lista.forEach(function (s) {
      var c = e.cues[s.cue] || {};
      var b = el("div", "big now"), k = el("div", "k");
      k.appendChild(el("span", "", T("sonando_cue", { n: c.numero || "" })));
      k.appendChild(el("span", "", (s.visual ? T("proyector") : salidaTexto(s.salida)) + (c.bucle ? " · " + T("bucle") : "")));
      b.appendChild(k);
      b.appendChild(el("div", "t", s.nombre));
      var resto = s.imagen ? T("imagen_fija") : s.restante_s != null ? "-" + mmss(s.restante_s) : T("en_bucle");
      b.appendChild(el("div", "remain num", (s.fundiendo ? T("fundiendo") : "") + resto));
      if (!s.imagen) { var bar = el("div", "bigbar"), i = el("i"); i.style.width = (s.progreso * 100) + "%"; bar.appendChild(i); b.appendChild(bar); }
      now.appendChild(b);
    });
    live.appendChild(now);
    var nx = e.cues[e.en_espera];
    var n = el("div", "big next"), k2 = el("div", "k");
    k2.appendChild(el("span", "", T("siguiente_go"))); k2.appendChild(el("span", "", nx ? (nx.tipo === "audio" ? salidaTexto(nx.salida) : T("proyector")) : ""));
    n.appendChild(k2);
    n.appendChild(el("div", "t", nx ? nx.numero + ". " + nx.nombre : T("fin_lista")));
    if (nx) {
      var estado = { listo: T("listo_memoria"), preparando: T("preparandose"), error: T("no_reproducible") }[nx.preparacion] || "";
      n.appendChild(el("div", "meta", [tipoTexto(nx.tipo), nx.duracion_s != null ? mmss(nx.duracion_s) : "", estado].filter(Boolean).join(" · ")));
      if (nx.nota) n.appendChild(el("div", "meta", nx.nota));
    }
    live.appendChild(n);
    lado.appendChild(live);
  }

  function avisoConexion(texto, clase) {
    $("conexion").className = "chip " + (clase || "");
    $("conexion-texto").textContent = texto;
  }

  // ---- Conexión con el motor ----
  function conectar() {
    ws = new WebSocket("ws://" + location.host + "/ws?t=" + encodeURIComponent(token));
    ws.onopen = function () { abierto = true; avisoConexion(T("conectado"), "on"); mandar("idioma", { idioma: idioma }); };
    ws.onmessage = function (m) {
      var d; try { d = JSON.parse(m.data); } catch (x) { return; }
      if (d.tipo !== "estado") return;
      e = d;
      if (desbloqueado != null && !(e.sonando || []).some(function (s) { return s.cue === desbloqueado; })) desbloqueado = null;
      dibujar();
    };
    ws.onclose = function () {
      abierto = false;
      avisoConexion(T("sin_conexion"), "");
      setTimeout(conectar, 700);
    };
  }

  // ---- Menús ----
  var menus = [].slice.call(document.querySelectorAll("[data-menu]"));
  function cerrarMenus() { menus.forEach(function (b) { b.setAttribute("aria-expanded", "false"); b.nextElementSibling.hidden = true; }); ocultarGlobo(); }
  menus.forEach(function (b) {
    b.onclick = function () {
      var m = b.nextElementSibling, abrir = m.hidden;
      cerrarMenus();
      if (abrir) { m.hidden = false; b.setAttribute("aria-expanded", "true"); }
    };
  });
  document.addEventListener("click", function (ev) { if (!ev.target.closest(".mb")) cerrarMenus(); });
  document.querySelectorAll(".menu").forEach(function (m) {
    m.addEventListener("click", function (ev) {
      var it = ev.target.closest("button"); if (!it || it.disabled) return;
      cerrarMenus();
      if (it.dataset.orden) mandar(it.dataset.orden);
      else if (it.dataset.tema) ponerTema(tema === it.dataset.tema ? "" : it.dataset.tema);
      else if (it.dataset.idioma) ponerIdioma(it.dataset.idioma);
      else if (it.dataset.accion === "restaurar") ponerTema("");
      else if (it.dataset.accion === "modo_ayuda") ponerAyuda(!ayudando);
      else if (it.dataset.accion === "pasos") primerosPasos(0);
      else if (it.dataset.accion === "consejos") ponerConsejos(!consejos);
      else if (it.dataset.accion === "atajos") dialogoAtajos();
      else if (it.dataset.accion === "acerca") dialogoAcerca();
    });
  });

  // Tema (Vista). Preferencia de esta ventana.
  function ponerTema(t) {
    tema = t;
    if (t) document.documentElement.setAttribute("data-tema", t); else document.documentElement.removeAttribute("data-tema");
    document.querySelectorAll("button[data-tema]").forEach(function (b) { b.setAttribute("aria-checked", String(b.dataset.tema === t)); });
    escribir("ota-tema", t);
  }
  // Idioma: todo el programa cambia junto (textos, consejos, ayuda y avisos del motor).
  function ponerIdioma(i) {
    idioma = i === "en" ? "en" : "es";
    escribir("ota-idioma", idioma);
    mandar("idioma", { idioma: idioma });
    aplicarTextos();
  }
  // Consejos: se pueden ocultar; la casilla para volver a mostrarlos nunca se oculta.
  function ponerConsejos(si) {
    consejos = si;
    escribir("ota-consejos", si ? "si" : "no");
    document.body.classList.toggle("sin-consejos", !si);
    document.querySelector('[data-accion="consejos"]').setAttribute("aria-checked", String(si));
    ocultarGlobo();
    ladoClave = "";
    if (e) dibujarLado(e.modo === "funcion");
  }

  // ---- Globo de consejo (pasar el ratón o tocar el "?") ----
  var globo = null, globoDe = null, globoTimer = 0;
  function ocultarGlobo() {
    clearTimeout(globoTimer);
    if (globo) { globo.remove(); globo = null; }
    if (globoDe && globoDe.classList.contains("q")) globoDe.setAttribute("aria-expanded", "false");
    globoDe = null;
  }
  function mostrarGlobo(x) {
    ocultarGlobo();
    var c = TEXTOS[idioma].consejos[x.dataset.consejo]; if (!c) return;
    globoDe = x;
    globo = el("div", "globo"); globo.setAttribute("role", "tooltip");
    globo.appendChild(el("h3", "", c.titulo));
    globo.appendChild(el("p", "", c.que_hace));
    globo.appendChild(el("div", "k", T("consejo_usar")));
    globo.appendChild(el("p", "", c.activar));
    globo.appendChild(el("p", "ej", c.ejemplo_activar));
    globo.appendChild(el("div", "k", T("consejo_no")));
    globo.appendChild(el("p", "", c.desactivar));
    globo.appendChild(el("p", "ej", c.ejemplo_desactivar));
    document.body.appendChild(globo);
    var r = x.getBoundingClientRect(), g = globo.getBoundingClientRect();
    var left = r.right + 10, top = r.top - 8;
    if (left + g.width > innerWidth - 10) left = Math.max(10, r.left - g.width - 10);
    if (top + g.height > innerHeight - 10) top = Math.max(10, innerHeight - g.height - 10);
    globo.style.left = left + "px"; globo.style.top = top + "px";
    if (x.classList.contains("q")) x.setAttribute("aria-expanded", "true");
  }
  document.addEventListener("mouseover", function (ev) {
    if (!consejos || ayudando) return;
    var x = ev.target.closest("[data-consejo]");
    if (!x || x === globoDe) return;
    clearTimeout(globoTimer);
    globoTimer = setTimeout(function () { mostrarGlobo(x); }, 450);
  });
  document.addEventListener("mouseout", function (ev) {
    var x = ev.target.closest("[data-consejo]");
    if (x && !x.contains(ev.relatedTarget)) { clearTimeout(globoTimer); if (globoDe === x) ocultarGlobo(); }
  });
  document.addEventListener("click", function (ev) {
    var q = ev.target.closest("button.q");
    if (!q || ayudando) return;
    ev.preventDefault(); ev.stopPropagation();
    if (globoDe === q) ocultarGlobo(); else mostrarGlobo(q);
  }, true);

  // ---- Modo Ayuda: tocar cualquier parte y ver qué hace ----
  var ayudando = false, burbuja = null;
  function cerrarBurbuja() { if (burbuja) { burbuja.remove(); burbuja = null; } }
  function ponerAyuda(si) {
    ayudando = si;
    document.body.classList.toggle("helping", si);
    $("app").classList.toggle("helping", si);
    document.querySelector('[data-accion="modo_ayuda"]').setAttribute("aria-checked", String(si));
    ocultarGlobo();
    if (!si) cerrarBurbuja();
  }
  function mostrarAyuda(x) {
    cerrarBurbuja();
    var a = ayudaDe(x.dataset.help); if (!a) return;
    burbuja = el("div", "burbuja"); burbuja.setAttribute("role", "dialog");
    burbuja.appendChild(el("h3", "", a[0]));
    burbuja.appendChild(el("p", "", a[1]));
    var ok = el("button", "ok", T("entendido")); ok.onclick = cerrarBurbuja; burbuja.appendChild(ok);
    document.body.appendChild(burbuja);
    var r = x.getBoundingClientRect(), b = burbuja.getBoundingClientRect();
    var top = r.bottom + 10; if (top + b.height > innerHeight - 10) top = Math.max(10, r.top - b.height - 10);
    var left = Math.min(Math.max(16, r.left + r.width / 2 - b.width / 2), innerWidth - b.width - 16);
    burbuja.style.top = top + "px"; burbuja.style.left = left + "px";
    ok.focus();
  }
  // Con el Modo Ayuda, un clic explica en vez de hacer (las teclas siguen funcionando).
  document.addEventListener("click", function (ev) {
    if (!ayudando || ev.target.closest(".helpbar,.burbuja,.velo")) return;
    ev.preventDefault(); ev.stopPropagation();
    var x = ev.target.closest("[data-help]");
    if (x) mostrarAyuda(x); else cerrarBurbuja();
  }, true);
  $("salirAyuda").onclick = function () { ponerAyuda(false); };

  // ---- Ventanitas ----
  var velo = null;
  function cerrarDialogo() { if (velo) { velo.remove(); velo = null; } }
  function dialogo(titulo, cuerpo, sinOk) {
    cerrarDialogo();
    velo = el("div", "velo");
    var d = el("div", "dlg"); d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true");
    d.appendChild(el("h2", "", titulo));
    cuerpo(d);
    if (!sinOk) { var ok = el("button", "ok", T("entendido")); ok.onclick = cerrarDialogo; d.appendChild(ok); }
    velo.appendChild(d);
    velo.onclick = function (ev) { if (ev.target === velo) cerrarDialogo(); };
    document.body.appendChild(velo);
    var f = d.querySelector("button"); if (f) f.focus();
  }
  function dialogoAtajos() {
    dialogo(T("atajos"), function (d) {
      var t = el("table");
      [[T("tecla_espacio"), "atajo_go"], ["Esc", "atajo_esc"], ["P", "atajo_p"], ["F", "atajo_f"], [T("tecla_mayus") + " + F", "atajo_mf"], ["↑  ↓", "atajo_flechas"], ["Tab", "atajo_tab"], ["H", "atajo_h"], ["Ctrl + S", "atajo_s"]]
        .forEach(function (f) { var tr = el("tr"), a = el("td"); a.appendChild(el("kbd", "", f[0])); tr.appendChild(a); tr.appendChild(el("td", "", T(f[1]))); t.appendChild(tr); });
      d.appendChild(t);
    });
  }
  function dialogoAcerca() {
    dialogo(T("acerca"), function (d) {
      var b = el("div", "bars"); [.38, .72, 1, .58, .84, .46].forEach(function (h) { var i = el("i"); i.style.setProperty("--h", h); b.appendChild(i); });
      d.appendChild(b);
      d.appendChild(el("p", "", T("acerca_1")));
      d.appendChild(el("p", "", T("acerca_2")));
      var c = el("p"); c.appendChild(document.createTextNode(T("acerca_3a"))); c.appendChild(el("span", "accent", "@marcold.ok"));
      c.appendChild(document.createTextNode(T("acerca_3b")));
      d.appendChild(c);
      d.appendChild(el("p", "accent", T("nadie")));
    });
  }
  function primerosPasos(n) {
    var pasos = TEXTOS[idioma].pasos;
    escribir("ota-pasos-vistos", "si");
    dialogo(pasos[n][0], function (d) {
      d.appendChild(el("p", "", pasos[n][1]));
      var nav = el("div", "nav");
      var atras = el("button", "atras", T("anterior")); atras.disabled = n === 0;
      atras.onclick = function () { primerosPasos(n - 1); };
      nav.appendChild(atras);
      nav.appendChild(el("span", "", T("paso_n", { n: n + 1, total: pasos.length })));
      var sig = el("button", "", n === pasos.length - 1 ? T("entendido") : T("siguiente"));
      sig.onclick = function () { if (n === pasos.length - 1) cerrarDialogo(); else primerosPasos(n + 1); };
      nav.appendChild(sig);
      d.appendChild(nav);
      setTimeout(function () { sig.focus(); }, 0);
    }, true);
  }

  // ---- Botones ----
  $("go").onclick = function () { mandar("go"); };
  $("parar").onclick = function () { mandar("parar_todo"); };
  $("pausa").onclick = function () { mandar("pausa"); };
  $("fundir").onclick = function () { mandar("fundir_todo"); };
  $("mEdicion").onclick = function () { mandar("modo_edicion"); };
  $("mFuncion").onclick = function () { mandar("modo_funcion"); };
  $("aviso-cerrar").onclick = function () { mandar("cerrar_aviso"); };
  $("lista").addEventListener("click", function (ev) {
    if (!e || e.modo === "funcion") return;
    var r = ev.target.closest(".row"); if (r) mandar("ir_a", { cue: +r.dataset.i });
  });
  $("lista").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && e && e.modo !== "funcion") { var r = ev.target.closest(".row"); if (r) mandar("ir_a", { cue: +r.dataset.i }); }
  });

  // ---- Teclado (también funciona en el Modo Ayuda: GO y Parar todo nunca se bloquean) ----
  document.addEventListener("keydown", function (ev) {
    // Esc para todo SIEMPRE (pánico): nunca se retrasa por un menú, una ventanita o la ayuda.
    if (ev.key === "Escape") { ev.preventDefault(); mandar("parar_todo"); cerrarMenus(); cerrarDialogo(); cerrarBurbuja(); ponerAyuda(false); return; }
    var escribiendo = ev.target.matches && ev.target.matches("input[type=text],textarea,select");
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === "s" || ev.key === "S")) { ev.preventDefault(); mandar("guardar"); return; }
    if (escribiendo || ev.ctrlKey || ev.metaKey || ev.altKey) return;   // con foco en un campo, Tab pasa de campo
    if (ev.key === " ") { ev.preventDefault(); cerrarDialogo(); cerrarMenus(); cerrarBurbuja(); mandar("go"); return; }
    if (velo) return;
    if (ev.key === "Tab") { ev.preventDefault(); if (e) mandar(e.modo === "funcion" ? "modo_edicion" : "modo_funcion"); }
    else if (ev.key === "h" || ev.key === "H") ponerAyuda(!ayudando);
    else if (ev.key === "p" || ev.key === "P") mandar("pausa");
    else if ((ev.key === "f" || ev.key === "F") && ev.shiftKey) mandar("fundir_ultimo");
    else if (ev.key === "f" || ev.key === "F") mandar("fundir_todo");
    else if (ev.key === "ArrowUp") { ev.preventDefault(); mandar("espera_arriba"); }
    else if (ev.key === "ArrowDown") { ev.preventDefault(); mandar("espera_abajo"); }
  });

  // ---- Reloj ----
  function reloj() {
    var d = new Date();
    $("reloj").textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (x) { return String(x).padStart(2, "0"); }).join(":");
  }

  // ---- Arranque ----
  ponerTema(tema);
  ponerConsejos(consejos);
  aplicarTextos();
  reloj(); setInterval(reloj, 1000);
  conectar();
  // La primera vez, la guía de primeros pasos.
  if (leer("ota-pasos-vistos", "") !== "si") primerosPasos(0);
})();
</script>
</body>
</html>
