      [["parar", "bt_rep_parar"], ["reiniciar", "bt_rep_reiniciar"], ["superponer", "bt_rep_superponer"]].forEach(function (o) { var op = el("option", "", T(o[1])); op.value = o[0]; op.selected = o[0] === b.al_repetir; rep.appendChild(op); });
      rep.onchange = function () { b.al_repetir = rep.value; };
      campo("bt_al_repetir", rep, "boton_repetir", true);
      var tg = el("label", "toggle"), cb = el("input"); cb.type = "checkbox"; cb.checked = b.bucle; cb.onchange = function () { b.bucle = cb.checked; };
      tg.appendChild(cb); tg.appendChild(document.createTextNode(T("repetir_bucle"))); tg.appendChild(botonConsejo("bucle"));
      f.appendChild(tg);
      var acc = el("div", "bt-ed-acc");
      [["↑", -1], ["↓", 1]].forEach(function (m) {
        var x = el("button", "btn chico", m[0]); x.type = "button"; x.disabled = k + m[1] < 0 || k + m[1] >= pag.botones.length;
        x.onclick = function () { var t = pag.botones.splice(k, 1)[0]; pag.botones.splice(k + m[1], 0, t); pintarEditor(); };
        acc.appendChild(x);
      });
      var q = el("button", "btn chico parar-uno", T("bt_quitar")); q.type = "button"; q.onclick = function () { pag.botones.splice(k, 1); pintarEditor(); };
      acc.appendChild(q);
      f.appendChild(acc);
      cu.appendChild(f);
    });
    cu.scrollTop = arriba;
  }

  // ---- Onda del audio (etapa 5D) ----
  // Los picos los calcula el motor (orden "onda"); aquí se guardan por archivo.
  var ondas = {}, ondaPedida = {};
  function seccionOnda(i, c, editar, bloqueado) {
    var w = el("div", "onda-caja");
    var t = el("div", "onda-titulo"); t.appendChild(el("span", "", T("onda"))); t.appendChild(botonConsejo("onda"));
    w.appendChild(t);
    var cv = el("canvas", "onda"); cv.width = 800; cv.height = 90; cv.dataset.cue = i;
    w.appendChild(cv);
    w.appendChild(el("p", "note-small", T("onda_ayuda")));
    var o = ondas[c.archivo];
    if (!o && c.preparacion === "listo" && !ondaPedida[c.archivo]) { ondaPedida[c.archivo] = true; mandar("onda", { cue: i }); }
    cv.onclick = function (ev) {
      var on = ondas[c.archivo]; if (!on || bloqueado) return;
      var r = cv.getBoundingClientRect();
      var s = Math.max(0, Math.min(on.total_s, (ev.clientX - r.left) / r.width * on.total_s));
      var ms = Math.round(s * 1000);
      if (ev.shiftKey) { if (ms > c.inicio_s * 1000) editar({ fin_ms: ms }); }
      else if (c.fin_s == null || ms < c.fin_s * 1000) editar({ inicio_ms: ms });
    };
    pintarOnda(cv, c);
    return w;
  }
  function pintarOnda(cv, c) {
    var ctx = cv.getContext("2d"), W = cv.width, H = cv.height, o = ondas[c.archivo];
    var css = getComputedStyle(document.documentElement);
    ctx.clearRect(0, 0, W, H);
    if (!o) {
      ctx.fillStyle = css.getPropertyValue("--dim");
      ctx.font = "13px " + css.getPropertyValue("--font");
      ctx.fillText(c.preparacion === "listo" ? T("onda_calculando") : T("onda_preparando"), 10, H / 2 + 4);
      return;
    }
    var n = o.picos.length, ini = (c.inicio_s || 0) / o.total_s, fin = (c.fin_s != null ? c.fin_s : o.total_s) / o.total_s;
    var acento = css.getPropertyValue("--accent"), apagado = css.getPropertyValue("--dim");
    // Un archivo suave se agranda (hasta 8 veces) para que se vea su forma.
    var max = Math.max.apply(null, o.picos.concat([1])), escala = Math.min(8, 1000 / max);
    for (var k = 0; k < n; k++) {
      var x = k / n, h = Math.max(1, Math.min(1000, o.picos[k] * escala) / 1000 * (H - 6));
      ctx.fillStyle = x >= ini && x <= fin ? acento : apagado;
      ctx.fillRect(Math.floor(x * W), (H - h) / 2, Math.max(1, Math.ceil(W / n) - 0), h);
    }
    ctx.fillStyle = css.getPropertyValue("--text");
    [ini, fin].forEach(function (p) { ctx.fillRect(Math.round(p * W) - 1, 0, 2, H); });
  }
  function recibirOnda(d) {
    ondas[d.archivo] = { picos: d.picos, total_s: d.total_s };
    delete ondaPedida[d.archivo];
    document.querySelectorAll("canvas.onda").forEach(function (cv) {
      var c = e && e.cues[+cv.dataset.cue];
      if (c && c.archivo === d.archivo) pintarOnda(cv, c);
    });
  }

  // ---- «Ver antes» solo por Auriculares (etapa 5C) ----
  function botonEscucha(i) {
    var activo = e.escucha === i;
    var b = el("button", "btn chico escucha" + (activo ? " activa" : ""), activo ? T("escucha_parar") : T("escucha"));
    b.type = "button"; b.dataset.escucha = i; b.dataset.consejo = "escucha";
    return b;
  }
  // Al apretar (los paneles se redibujan seguido).
  document.addEventListener("pointerdown", function (ev) {
    var b = ev.target.closest && ev.target.closest("[data-escucha]");
    if (!b || ayudando || ev.button !== 0) return;
    ev.preventDefault();
    mandar("ver_antes", { cue: +b.dataset.escucha });
  });

  // ---- Medidor de nivel (lo que sale de verdad, después del limitador) ----
  // El motor manda el pico de cada 100 ms en dB; aquí se dibuja con caída suave
  // y una marca que recuerda el pico 1,5 s.
  var medidor = {};
  function barraMedidor() { var b = el("div", "med-barra"); b.appendChild(el("i")); b.appendChild(el("b")); return b; }
  function grupoMedidor(clave, nombre) {
    var g = el("div", "med-grupo"); g.dataset.salida = clave;
    g.appendChild(el("span", "", nombre));
    var bs = el("div", "med-barras"), izq = barraMedidor(), der = barraMedidor();
    bs.appendChild(izq); bs.appendChild(der); g.appendChild(bs);
    var lim = el("span", "lim", "LIM"); lim.title = T("medidor_lim"); g.appendChild(lim);
    medidor[clave] = { g: g, barras: [izq, der], lim: lim, nivel: [-90, -90], pico: [-90, -90], hasta: [0, 0], limHasta: 0 };
    $("medidor").appendChild(g);
  }
  function pct(db) { return Math.max(0, Math.min(100, (db + 60) / 60 * 100)); }
  var ultimosNiveles = 0;
  // Sin datos nuevos (todo en silencio): las barras caen solas.
  setInterval(function () {
    if (Date.now() - ultimosNiveles < 250) return;
    var d = {};
    Object.keys(medidor).forEach(function (k) { d[k] = { db: [-90, -90], limitando: false }; });
    if (Object.keys(d).length) recibirNiveles(d, true);
  }, 100);
  function recibirNiveles(d, solo) {
    if (!solo) ultimosNiveles = Date.now();
    var ahora = Date.now();
    [["principal", T("med_sala")], ["auriculares", T("med_auris")]].forEach(function (x) {
      var dato = d[x[0]];
      if (!dato) { if (medidor[x[0]]) { medidor[x[0]].g.remove(); delete medidor[x[0]]; } return; }
      if (!medidor[x[0]]) grupoMedidor(x[0], x[1]);
      var m = medidor[x[0]];
      for (var k = 0; k < 2; k++) {
        var db = dato.db[k];
        m.nivel[k] = Math.max(db, m.nivel[k] - 3);   // cae 30 dB por segundo
        if (db >= m.pico[k] || ahora > m.hasta[k]) { m.pico[k] = db; m.hasta[k] = ahora + 1500; }
        m.barras[k].firstChild.style.width = pct(m.nivel[k]) + "%";
        m.barras[k].lastChild.style.left = "calc(" + pct(m.pico[k]) + "% - 2px)";
        m.barras[k].lastChild.style.display = m.pico[k] > -60 ? "" : "none";
      }
      if (dato.limitando) m.limHasta = ahora + 1000;
      m.lim.classList.toggle("on", ahora < m.limHasta);
    });
    pintarMezclador();
  }

  // ---- Botones ----
  // Vista Estudio (como OBS): el GO reemplaza lo anterior; en la Vista Lista se superpone.
  function darGo() { mandar("go", { reemplazar: estilo === "estudio" }); }
  $("go").onclick = darGo;
  $("parar").onclick = function () { mandar("parar_todo"); };
  $("pausa").onclick = function () { mandar("pausa"); };
  $("fundir").onclick = function () { mandar("fundir_todo"); };
  $("mEdicion").onclick = function () { mandar("modo_edicion"); };
  $("mFuncion").onclick = function () { mandar("modo_funcion"); };
  $("aviso-cerrar").onclick = function () { avisoPropio = ""; mandar("cerrar_aviso"); if (e) dibujar(); };
  // Buscador: filtra la lista mientras se escribe; Enter deja en espera el
  // primer cue que coincide (nunca dispara) y suelta el foco para que Espacio sea GO.
  $("buscar").addEventListener("input", function () { busqueda = $("buscar").value; if (e) dibujarLista(); });
  $("buscar").addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    var r = $("lista").querySelector(".row:not(.oculta)");
    if (r) mandar("ir_a", { cue: +r.dataset.i });
    $("buscar").blur();
  });
  $("lista").addEventListener("click", function (ev) {
    // En Función solo se elige con el ratón en la Vista Estudio (nunca dispara).
    if (ignorarClic || !e || (e.modo === "funcion" && estilo !== "estudio")) return;
    var r = ev.target.closest(".row"); if (r) mandar("ir_a", { cue: +r.dataset.i });
  });
  $("lista").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && e && (e.modo !== "funcion" || estilo === "estudio")) { var r = ev.target.closest(".row"); if (r) mandar("ir_a", { cue: +r.dataset.i }); }
  });

  // ---- Teclado (también funciona en el Modo Ayuda: GO y Parar todo nunca se bloquean) ----
  // ---- Atajos (parte 5) ----
  // Todos los atajos del programa, con su tecla de fábrica, si vienen
  // encendidos y qué hacen. El usuario los enciende, apaga o cambia de tecla
  // (Ayuda → Atajos de teclado); se guarda en este equipo. Esc = Parar todo
  // es fijo (pánico, siempre); GO se puede cambiar de tecla pero no apagar.
  // [id, grupo, tecla de fábrica, encendido de fábrica, fijo, acción]
  // fijo: "siempre" = no se apaga ni se cambia; "tecla" = se cambia de tecla, no se apaga.
  var ATAJOS = [
    ["go", "g_funcion", "Space", true, "tecla", function () { cerrarDialogo(); cerrarMenus(); cerrarBurbuja(); darGo(); }],
    ["parar_todo", "g_funcion", "Escape", true, "siempre", null],
    ["pausa", "g_funcion", "P", true, "", function () { mandar("pausa"); }],
    ["fundir_todo", "g_funcion", "F", true, "", function () { mandar("fundir_todo"); }],
    ["fundir_ultimo", "g_funcion", "Shift+F", true, "", function () { mandar("fundir_ultimo"); }],
    ["espera_arriba", "g_funcion", "ArrowUp", true, "", function () { mandar("espera_arriba"); }],
    ["espera_abajo", "g_funcion", "ArrowDown", true, "", function () { mandar("espera_abajo"); }],
    ["modo", "g_funcion", "Tab", true, "", function () { if (e) mandar(e.modo === "funcion" ? "modo_edicion" : "modo_funcion"); }],
    ["guardar", "g_funcion", "Ctrl+S", true, "", function () { mandar("guardar"); }],
    ["corte_rapido", "g_estudio", "Shift+Space", true, "", function () { if (estilo === "estudio") mandar("go", { reemplazar: true, corte: true }); }],
    ["tbar_mas", "g_estudio", "PageDown", false, "", function () { moverPalanca(0.1); }],
    ["tbar_menos", "g_estudio", "PageUp", false, "", function () { moverPalanca(-0.1); }],
    ["escenas_numero", "g_estudio", "1…9", false, "grupo", null],
    ["multivista", "g_estudio", "M", false, "", function () { ponerMultivista(!multivista); }],
    ["cabina", "g_estudio", "F11", true, "", function () { ponerCabina(!cabina); }],
    ["nuevo", "g_edicion", "Ctrl+N", true, "", function () { if (puedeEditar()) mandar("nuevo_show"); else avisoLocal(T("abrir_funcion")); }],
    ["abrir", "g_edicion", "Ctrl+O", true, "", function () { if (puedeEditar()) mandar("abrir_show"); else avisoLocal(T("abrir_funcion")); }],
    ["deshacer", "g_edicion", "Ctrl+Z", true, "", function () { if (puedeEditar()) mandar("deshacer"); }],
    ["rehacer", "g_edicion", "Ctrl+Y", true, "", function () { if (puedeEditar()) mandar("rehacer"); }],
    ["agregar", "g_edicion", "Ctrl+I", true, "", function () { dialogoAgregar(); }],
    ["eliminar", "g_edicion", "Delete", true, "", function () { eliminarCue(); }],
    ["subir", "g_edicion", "Alt+ArrowUp", true, "", function () { moverCue(-1); }],
    ["bajar", "g_edicion", "Alt+ArrowDown", true, "", function () { moverCue(1); }],
    ["buscar", "g_ventana", "Ctrl+F", true, "", function () { $("buscar").focus(); $("buscar").select(); }],
    ["buscar2", "g_ventana", "/", true, "", function () { $("buscar").focus(); $("buscar").select(); }],
    ["ayuda", "g_ventana", "H", true, "", function () { ponerAyuda(!ayudando); }],
    ["fader_rueda", "g_faders", "—", true, "raton", null],
    ["fader_teclas", "g_faders", "—", true, "raton", null]];
  // Juegos recomendados: qué atajos quedan encendidos.
  var JUEGOS = {
    minimo: ["go", "parar_todo", "pausa", "fundir_todo", "guardar", "fader_rueda", "fader_teclas"],
    completo: ATAJOS.map(function (a) { return a[0]; })
  };
  var atajosUsuario = {};
  try { atajosUsuario = JSON.parse(leer("ota-atajos", "{}")) || {}; } catch (x) { atajosUsuario = {}; }
  function atajoDe(id) { return ATAJOS.filter(function (a) { return a[0] === id; })[0]; }
  function teclaAtajo(id) { var a = atajoDe(id), u = atajosUsuario[id]; return (u && u.tecla) || a[2]; }
  function atajoActivo(id) {
    var a = atajoDe(id), u = atajosUsuario[id];
    if (!a) return false;
    if (a[4] === "siempre" || a[4] === "tecla") return true;
    return u && u.on != null ? !!u.on : a[3];
  }
  function guardarAtajos() { escribir("ota-atajos", JSON.stringify(atajosUsuario)); }
  // La tecla de un evento como texto: «Ctrl+Shift+F», «Space», «ArrowUp», «1».
  function teclaDe(ev) {
    var k = ev.key === " " ? "Space" : ev.key.length === 1 ? ev.key.toUpperCase() : ev.key;
    if (k === "Control" || k === "Shift" || k === "Alt" || k === "Meta") return "";
    var m = [];
    if (ev.ctrlKey || ev.metaKey) m.push("Ctrl");
    if (ev.altKey) m.push("Alt");
    // Mayús solo cuenta en teclas que no son un signo (así «?» o «/» valen en cualquier teclado).
    if (ev.shiftKey && (k.length > 1 || /[A-Z0-9]/.test(k))) m.push("Shift");
    m.push(k);
    return m.join("+");
  }
  function nombreTecla(t) {
    var n = { Space: T("tecla_espacio"), Escape: "Esc", ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→", Delete: T("tecla_supr"),
      PageUp: T("tecla_repag"), PageDown: T("tecla_avpag"), Tab: "Tab", Shift: T("tecla_mayus") };
    return String(t).split("+").map(function (p) { return n[p] || p; }).join(" + ");
  }
  // Qué tecla choca con qué (entre atajos encendidos y con la botonera).
  function choques() {
    var usadas = {}, malos = {};
    ATAJOS.forEach(function (a) {
      if (!atajoActivo(a[0]) || a[4] === "raton" || a[4] === "grupo") return;
      var t = teclaAtajo(a[0]);
      if (usadas[t]) { malos[a[0]] = usadas[t]; malos[usadas[t]] = a[0]; } else usadas[t] = a[0];
    });
    var bt = {};
    ((e && e.botonera) || []).forEach(function (p) { (p.botones || []).forEach(function (b) { if (b.tecla) bt[String(b.tecla).toUpperCase()] = b.nombre; }); });
    return { atajos: malos, botonera: bt };
  }
  var capturando = null;   // atajo al que se le está eligiendo tecla (editor)
  document.addEventListener("keydown", function (ev) {
    // Esc para todo SIEMPRE (pánico): nunca se retrasa por un menú, una ventanita o la ayuda.
    if (ev.key === "Escape") { ev.preventDefault(); capturando = null; mandar("parar_todo"); cerrarMenus(); cerrarDialogo(); cerrarBurbuja(); ponerAyuda(false); return; }
    // Editor de atajos esperando una tecla: esa tecla es para él.
    if (capturando) { var t0 = teclaDe(ev); if (!t0) return; ev.preventDefault(); ev.stopPropagation(); capturando(t0); capturando = null; return; }
    var escribiendo = ev.target.matches && ev.target.matches("input[type=text],input[type=number],textarea,select");
    var tecla = teclaDe(ev);
    if (!tecla) return;
    var conCtrl = ev.ctrlKey || ev.metaKey;
    // Escribiendo en un campo, las teclas sueltas no disparan nada (Tab pasa de
    // campo, Ctrl+Z deshace lo escrito); solo Ctrl+S, Ctrl+F y Ctrl+O/N/I.
    if (escribiendo && (!conCtrl || /^Ctrl\+(Z|Y|Shift\+Z)$/.test(tecla))) return;
    if (mapeo && !conCtrl && teclaMapeo(ev)) { ev.preventDefault(); return; }
    // Con una ventanita abierta solo valen el GO y lo que lleva Ctrl.
    var go = teclaAtajo("go");
    if (velo && tecla !== go && !conCtrl) return;
    // La botonera gana a los atajos de número de la Vista Estudio (también en Función).
    if (!conCtrl && !ev.altKey && teclaDeBoton(ev.key) && tecla !== go) { ev.preventDefault(); mandar("boton_tecla", { tecla: ev.key.length === 1 ? ev.key.toUpperCase() : ev.key }); return; }
    for (var j = 0; j < ATAJOS.length; j++) {
      var a = ATAJOS[j];
      if (!a[5] || !atajoActivo(a[0]) || teclaAtajo(a[0]) !== tecla) continue;
      if (velo && a[0] !== "go" && !/^(guardar|buscar)$/.test(a[0])) return;
      ev.preventDefault();
      a[5]();
      return;
    }
    // Teclas 1 a 9 de la Vista Estudio: esa escena a la Vista previa (nunca dispara).
    if (estilo === "estudio" && atajoActivo("escenas_numero") && /^[1-9]$/.test(tecla) && e && e.cues.length) {
      ev.preventDefault();
      var n = +tecla - 1, orden = ordenMultivista();
      var i = orden.length > n ? orden[n] : n;
      if (e.cues[i]) mandar("ir_a", { cue: i });
    }
  });

  // ---- Reloj ----
  function reloj() {
    var d = new Date();
    $("reloj").textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (x) { return String(x).padStart(2, "0"); }).join(":");
  }

  // ---- Arranque ----
  ponerTema(tema);
  ponerEstilo(estilo);
  ponerPreviaMov(previaMov);
  ponerBotonera(vistaBotonera);
  ponerRendimiento(rendimiento);
  ponerBloqueo(panelesBloqueados);
  ponerConsejos(consejos);
  aplicarTextos();
  reloj(); setInterval(reloj, 1000);
  conectar();
  // La primera vez, la guía de primeros pasos.
  if (leer("ota-pasos-vistos", "") !== "si") primerosPasos(0);
})();
