<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otaconvert V2</title>
<!-- Interfaz (etapas 3B y 3C): el boceto aprobado (v2/diseno/boceto-pantalla-principal.html)
     conectado al motor por el canal seguro. Todos los textos vienen de ui/textos.json
     (español e inglés, probados en tests/textos.rs): aquí se usan con la función T,
     y los atributos data-t, data-help (Modo Ayuda) y data-consejo (consejos).
     Lo que todavía no funciona aparece en gris con "Próximamente". Los textos del show
     se ponen siempre con textContent: nunca como HTML. -->
<style>
:root{
  color-scheme:dark;
  --bg:#0E1117;--card:#151921;--card2:#1B2029;--hover:#252B37;--border:#262C38;
  --text:#E9ECF2;--muted:#9098A8;--dim:#5D6677;
  --accent:#6F80FF;--accent-h:#5C6DEE;--ok:#58D69A;--err:#F27A74;--warn:#F2C46B;--on-accent:#0E1117;
  --font:"Segoe UI","SF Pro Display",system-ui,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
:root[data-tema="noche"]{
  --bg:#080404;--card:#100909;--card2:#160C0C;--hover:#211212;--border:#2A1515;
  --text:#D08A80;--muted:#8E5850;--dim:#5E3833;
  --accent:#B9463B;--accent-h:#A13C33;--ok:#B9463B;--err:#E0584C;--warn:#C0674E;--on-accent:#080404;
}
:root[data-tema="contraste"]{
  --bg:#000000;--card:#000000;--card2:#0D0D10;--hover:#1E1F26;--border:#BFC6D4;
  --text:#FFFFFF;--muted:#E1E5EC;--dim:#B8BECA;
  --accent:#8C9BFF;--accent-h:#A4B0FF;--ok:#6EF0AE;--err:#FF8A84;--warn:#FFD27A;--on-accent:#000000;
}
:root[data-tema="dia"]{
  color-scheme:light;
  --bg:#FFFFFF;--card:#F2F4F8;--card2:#E6EAF1;--hover:#D9DFE9;--border:#A9B2C1;
  --text:#05070C;--muted:#2E3543;--dim:#535B6B;
  --accent:#2A3FD9;--accent-h:#2033BD;--ok:#0B7340;--err:#C0261D;--warn:#8F5A00;--on-accent:#FFFFFF;
}
/* Tema opcional "Madera de fresno" (Vista → Madera de fresno): fresno claro con
   veta suave, paneles como madera cepillada, texto color nogal y un acento verde
   pino. Solo cambia colores y fondos; la distribución es la misma. */
:root[data-tema="fresno"]{
  color-scheme:light;
  --bg:#CDB491;--card:#F1E6D3;--card2:#E6D6BC;--hover:#DCC8A8;--border:#B89B74;
  --text:#2E2216;--muted:#5C4733;--dim:#80694F;
  --accent:#2F6A55;--accent-h:#26594A;--ok:#3B7A3A;--err:#A8382A;--warn:#8A5A12;--on-accent:#FFFDF8;
}
:root[data-tema="fresno"] body{
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(91deg, rgba(110,72,36,.07) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(89.4deg, rgba(255,246,228,.10) 0 2px, transparent 2px 23px),
    repeating-linear-gradient(90.6deg, rgba(96,62,30,.06) 0 3px, transparent 3px 61px),
    linear-gradient(90deg, rgba(255,240,214,.18), rgba(120,82,44,.10) 38%, rgba(255,240,214,.14) 71%, rgba(110,76,40,.10));
}
:root[data-tema="fresno"] .top,
:root[data-tema="fresno"] .panel,
:root[data-tema="fresno"] .dlg{
  background-image:
    repeating-linear-gradient(90.5deg, rgba(150,110,62,.045) 0 1px, transparent 1px 9px),
    linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 60%);
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 6px 18px rgba(70,44,18,.16);
}
/* Tema opcional «Espacio exterior» (Vista → Espacio exterior, pedido y aprobado
   el 22/10/2026): espacial y futurista, como el tablero de una nave. Estrellas,
   nebulosas, banda de galaxia y un planeta con anillo, todo con degradados
   quietos (sin imágenes ni animaciones: no gasta nada). Paneles de cristal
   oscuro con borde luminoso y esquinas de radar; letra Bahnschrift (viene con
   Windows). En «Liviano» se apagan los brillos. */
:root[data-tema="espacio"]{
  --bg:#03040B;--card:#0A0F24;--card2:#0F1633;--hover:#162048;--border:#1F2B5C;
  --text:#E4F3FF;--muted:#8FA6D9;--dim:#56669C;
  --accent:#3CE6FF;--accent-h:#2BC8E0;--ok:#5CFFC8;--err:#FF4F7B;--warn:#FFD25A;--on-accent:#02121A;
  --font:"Bahnschrift","Segoe UI",system-ui,sans-serif;--radar:#3CE6FF;
}
:root[data-tema="espacio"] body{
  background-color:#03040B;
  background-image:
    radial-gradient(2px 2px at 8% 22%,#fff 50%,transparent 100%),radial-gradient(2.5px 2.5px at 37% 6%,#e6f7ff 50%,transparent 100%),
    radial-gradient(2px 2px at 63% 47%,#fff 50%,transparent 100%),radial-gradient(3px 3px at 91% 38%,#d6f3ff 45%,transparent 100%),
    radial-gradient(2px 2px at 22% 88%,#fff 50%,transparent 100%),radial-gradient(2px 2px at 76% 92%,#ffe7c2 50%,transparent 100%),
    radial-gradient(ellipse 210px 34px at 94% 104%,transparent 62%,rgba(160,210,255,.45) 64%,rgba(160,210,255,.12) 72%,transparent 74%),
    radial-gradient(circle 120px at 94% 104%,#4b3fa8 0%,#2a1f6b 45%,#120c33 70%,transparent 71%),
    linear-gradient(118deg,transparent 30%,rgba(140,120,255,.10) 42%,rgba(200,180,255,.16) 48%,rgba(120,200,255,.10) 54%,transparent 66%),
    radial-gradient(45% 40% at 85% 12%,rgba(180,80,255,.28),transparent 70%),
    radial-gradient(40% 35% at 70% 22%,rgba(255,70,160,.13),transparent 70%),
    radial-gradient(45% 45% at 8% 80%,rgba(30,200,255,.18),transparent 70%),
    radial-gradient(35% 30% at 30% 60%,rgba(60,90,255,.14),transparent 70%),
    radial-gradient(1px 1px at 20px 30px,#fff 98%,transparent),radial-gradient(1px 1px at 140px 90px,#cfe8ff 98%,transparent),
    radial-gradient(1px 1px at 90px 170px,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 180px 20px,#fff 98%,transparent),
    radial-gradient(1px 1px at 60px 120px,#ffeacc 98%,transparent),radial-gradient(1px 1px at 230px 140px,#fff 98%,transparent);
  background-size:auto,auto,auto,auto,auto,auto,auto,auto,auto,auto,auto,auto,auto,250px 210px,250px 210px,330px 290px,330px 290px,410px 370px,410px 370px;
  background-attachment:fixed;
}
:root[data-tema="espacio"] .top,:root[data-tema="espacio"] .panel,:root[data-tema="espacio"] .dlg,
:root[data-tema="espacio"] .mon,:root[data-tema="espacio"] .dock{
  position:relative;
  background:linear-gradient(180deg,rgba(60,230,255,.07),rgba(10,15,36,.55) 30%,rgba(5,8,20,.8));
  border:1px solid rgba(60,230,255,.28);border-radius:6px;
  box-shadow:inset 0 0 30px rgba(60,230,255,.06),0 0 18px -6px rgba(60,230,255,.45),0 14px 30px -12px #000;
}
:root[data-tema="espacio"] .mon::after,:root[data-tema="espacio"] .dock::after,:root[data-tema="espacio"] .panel::after{
  content:"";position:absolute;inset:-1px;pointer-events:none;border-radius:6px;
  background:
    linear-gradient(var(--radar),var(--radar)) top left/18px 2px no-repeat,linear-gradient(var(--radar),var(--radar)) top left/2px 18px no-repeat,
    linear-gradient(var(--radar),var(--radar)) top right/18px 2px no-repeat,linear-gradient(var(--radar),var(--radar)) top right/2px 18px no-repeat,
    linear-gradient(var(--radar),var(--radar)) bottom left/18px 2px no-repeat,linear-gradient(var(--radar),var(--radar)) bottom left/2px 18px no-repeat,
    linear-gradient(var(--radar),var(--radar)) bottom right/18px 2px no-repeat,linear-gradient(var(--radar),var(--radar)) bottom right/2px 18px no-repeat;
  filter:drop-shadow(0 0 4px var(--radar));
}
:root[data-tema="espacio"] .mon.programa{--radar:#FF4F7B;border-color:rgba(255,79,123,.45);box-shadow:inset 0 0 30px rgba(255,79,123,.08),0 0 18px -6px rgba(255,79,123,.4),0 14px 30px -12px #000}
:root[data-tema="espacio"] .mon.previa{box-shadow:inset 0 0 30px rgba(60,230,255,.08),0 0 18px -6px rgba(60,230,255,.4),0 14px 30px -12px #000}
:root[data-tema="espacio"] .mon-k strong,:root[data-tema="espacio"] .dock h3 .titulo,:root[data-tema="espacio"] .panel-h strong,:root[data-tema="espacio"] #nombre{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600}
:root[data-tema="espacio"] .dock h3{background:linear-gradient(90deg,rgba(60,230,255,.10),transparent 70%);border-bottom-color:rgba(60,230,255,.25)}
:root[data-tema="espacio"] .mon .pantalla{border:1px solid rgba(60,230,255,.35);border-radius:3px;box-shadow:0 0 10px -4px rgba(60,230,255,.3)}
:root[data-tema="espacio"] .mon .pantalla::before{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(160deg,rgba(255,255,255,.10),transparent 30%)}
:root[data-tema="espacio"] .est-centro .flecha{background:linear-gradient(90deg,#3CE6FF,#B46BFF,#FF4F7B);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.2em}
:root[data-tema="espacio"] .go-t{border-radius:50%;width:88px;height:88px;flex:none;margin:0 auto;padding:0;display:grid;place-content:center;transform:none;
  background:radial-gradient(circle at 50% 30%,#1d3a52 0%,#0d1c2e 60%,#070e1a 100%);border:1.5px solid rgba(60,230,255,.65);color:#9CF1FF;
  box-shadow:0 0 0 5px rgba(60,230,255,.06),0 0 14px -4px rgba(60,230,255,.45),inset 0 1px 0 rgba(255,255,255,.10),inset 0 -6px 12px rgba(0,0,0,.45)}
:root[data-tema="espacio"] .go-t:hover{border-color:#3CE6FF;color:#d8fbff}
:root[data-tema="espacio"] .corte-rapido,:root[data-tema="espacio"] .opc-b,:root[data-tema="espacio"] .fuente,:root[data-tema="espacio"] .aire-linea,
:root[data-tema="espacio"] .btn,:root[data-tema="espacio"] .dock .side-btns .tb{border-radius:4px;border-color:rgba(60,230,255,.25);background:linear-gradient(180deg,rgba(60,230,255,.08),rgba(10,15,36,.6))}
:root[data-tema="espacio"] .dock #go{border-radius:4px;background:linear-gradient(180deg,#123049,#0a1a2b);border:1px solid rgba(60,230,255,.6);color:#9CF1FF;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 10px -4px rgba(60,230,255,.5);letter-spacing:.15em}
:root[data-tema="espacio"] .dock .side-btns .panic{background:linear-gradient(180deg,#3a1220,#220a13);border:1px solid rgba(255,79,123,.65);color:#FFC2D0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 10px -4px rgba(255,79,123,.5);text-transform:uppercase;letter-spacing:.12em}
:root[data-tema="espacio"] .tbar .riel{border-radius:3px;border-color:rgba(60,230,255,.35);background:repeating-linear-gradient(0deg,rgba(60,230,255,.10) 0 1px,transparent 1px 8px),#04070f}
:root[data-tema="espacio"] .tbar .riel::before{background:linear-gradient(180deg,#3CE6FF,#B46BFF,#FF4F7B);opacity:.65}
:root[data-tema="espacio"] .tbar .riel i,:root[data-tema="espacio"] .fader2 .riel .perilla{background:linear-gradient(180deg,#c9d3df,#7d8a9a);border:1px solid rgba(60,230,255,.5);box-shadow:0 1px 3px rgba(0,0,0,.6);border-radius:2px}
:root[data-tema="espacio"] .fader2 .riel .lleno{background:linear-gradient(90deg,rgba(180,107,255,.7),rgba(60,230,255,.75));box-shadow:none}
:root[data-tema="espacio"] .mv-tile{border-radius:4px;border-color:rgba(60,230,255,.22)}
:root[data-tema="espacio"] .mv-tile.prev{border-color:#3CE6FF;box-shadow:0 0 0 1px #3CE6FF,0 0 10px -3px rgba(60,230,255,.6)}
:root[data-tema="espacio"] .mv-tile.prev .mv-tal{color:#02121A}
:root[data-tema="espacio"] .mv-tile.aire{border-color:#FF4F7B;box-shadow:0 0 0 1px #FF4F7B,0 0 10px -3px rgba(255,79,123,.6)}
:root[data-tema="espacio"] .mv-lab{text-transform:uppercase;letter-spacing:.06em;font-size:10px}
:root[data-tema="espacio"] .seg2 button.on,:root[data-tema="espacio"] .mini-tr button.on{color:#BFF6FF;background:rgba(60,230,255,.16);box-shadow:inset 0 0 0 1px rgba(60,230,255,.6)}
:root[data-tema="espacio"] .mv-gnom{color:#3CE6FF;letter-spacing:.18em}
:root[data-tema="espacio"] .fuente .ic{border-radius:3px;background:linear-gradient(135deg,#B46BFF,#3CE6FF)}
:root[data-tema="espacio"] .seg button[aria-pressed="true"]{background:rgba(60,230,255,.16);color:#BFF6FF;box-shadow:inset 0 0 0 1px rgba(60,230,255,.6)}
:root[data-tema="espacio"] .clock{color:#3CE6FF;text-shadow:0 0 6px rgba(60,230,255,.35);letter-spacing:.1em}
:root[data-tema="espacio"] .bars i{background:#3CE6FF;box-shadow:0 0 5px rgba(60,230,255,.5)}
:root[data-tema="espacio"] .dlg{background:linear-gradient(180deg,rgba(60,230,255,.08),rgba(5,8,20,.97) 25%),#05081A}
:root.liviano[data-tema="espacio"] .mon::after,:root.liviano[data-tema="espacio"] .dock::after,:root.liviano[data-tema="espacio"] .panel::after{filter:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:12px var(--mono);background:var(--card2);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--text)}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column;gap:12px;padding:8px 16px 10px}

/* Barra de menús */
.menubar{display:flex;align-items:center;gap:2px;margin:0 0 -6px;padding:0 2px}
.mb{position:relative}
.mb>button{background:none;border:0;border-radius:8px;padding:5px 10px;color:var(--muted);font-size:13px}
.mb>button:hover,.mb>button[aria-expanded="true"]{background:var(--hover);color:var(--text)}
.menu{position:absolute;left:0;top:calc(100% + 4px);z-index:25;min-width:250px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.menu button{background:none;border:0;text-align:left;padding:8px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu button:disabled{opacity:.45}
.menu button[aria-checked="true"]::after{content:"✓";color:var(--accent)}
.menu kbd{font-size:11px;padding:0 5px}
.menu .sep{height:1px;background:var(--border);margin:4px 6px}
.menu .lbl{font-size:12px;color:var(--dim);padding:6px 12px 2px}
.pronto{font-size:11px;color:var(--dim)}

/* Cabecera */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.bars{display:flex;align-items:center;gap:3px;height:22px}
.bars i{display:block;width:4px;border-radius:2px;background:var(--accent);height:calc(var(--h)*100%);transform-origin:center}
.busy .bars i{animation:ola 1s ease-in-out infinite;animation-delay:calc(var(--d)*-0.17s)}
@keyframes ola{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.busy .bars i{animation:none}}
.show-name{display:flex;flex-direction:column;min-width:0}
.show-name strong{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-name span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.tabs button{background:none;border:0;border-radius:9px;padding:6px 14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card2);color:var(--text)}
.tabs button:disabled{opacity:.45}
.spacer{flex:1}
.modes{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:5px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
.chip.on .dot{background:var(--ok)}
.chip.warn .dot{background:var(--warn)}
.chip.luz{cursor:pointer;font:inherit;font-size:12px}
.medidor{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.medidor .med-grupo{display:flex;align-items:center;gap:5px}
.medidor .med-barras{display:flex;flex-direction:column;gap:2px;width:84px}
.medidor .med-barra{position:relative;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.medidor .med-barra i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--ok) 0 70%,var(--warn) 70% 90%,var(--err) 90%);background-size:84px 100%}
.medidor .med-barra b{position:absolute;top:0;bottom:0;width:2px;background:var(--text);left:0;opacity:.8}
.medidor .lim{font-weight:700;letter-spacing:.02em;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:0 4px}
.medidor .lim.on{color:var(--on-accent);background:var(--err);border-color:var(--err)}
.chip.luz .dot{background:var(--dim)}
.chip.luz.bien .dot{background:var(--ok)}
.chip.luz.aviso .dot{background:var(--warn)}
.chip.luz.problema .dot{background:var(--err)}
.chip.luz.problema{color:var(--err);border-color:var(--err)}
.puntos{list-style:none;margin:0;padding:0;max-height:min(55vh,480px);overflow:auto;display:flex;flex-direction:column;gap:6px}
.puntos li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
.puntos li .dot{flex:none;margin-top:5px}
.puntos li.bien .dot{background:var(--ok)}
.puntos li.aviso .dot{background:var(--warn)}
.puntos li.problema .dot{background:var(--err)}
.barra-prog{height:6px;border-radius:9px;background:var(--border);overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--accent)}
.clock{font:600 15px var(--mono);color:var(--text)}
.btn{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:7px 12px}
.btn:hover{background:var(--hover)}

/* Aviso */
.aviso{display:flex;align-items:center;gap:12px;background:var(--card2);border-left:3px solid var(--warn);border-radius:0 12px 12px 0;padding:8px 8px 8px 12px}
.aviso p{margin:0;flex:1}
.aviso button{background:none;border:0;color:var(--muted);border-radius:8px;padding:4px 8px}
.aviso button:hover{background:var(--hover);color:var(--text)}

/* Cuerpo */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
.col-izq{display:flex;flex-direction:column;gap:12px;min-height:0}
.col-izq>.panel:first-child{flex:1}
.botonera{flex:none;max-height:40%}
.bt-cuerpo{overflow:auto;padding:10px 12px 12px}
.paginas{display:flex;gap:4px;flex-wrap:wrap}
.paginas button{background:none;border:1px solid var(--border);border-radius:8px;padding:2px 9px;font-size:12px;color:var(--muted)}
.paginas button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bt-cuadricula{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.bt{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:74px;padding:8px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card2);text-align:left;color:var(--text);cursor:pointer;overflow:hidden}
.bt::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--bt-color,var(--accent))}
.bt .bt-n{font-weight:600;line-height:1.2;word-break:break-word}
.bt .bt-pie{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.bt.sonando{background:color-mix(in srgb,var(--bt-color,var(--accent)) 28%,var(--card2));border-color:var(--bt-color,var(--accent))}
.bt.error .bt-pie{color:var(--err)}
.bt-lista{display:flex;flex-direction:column;gap:6px}
.bt-lista .bt{min-height:0;flex-direction:row;align-items:center;padding:7px 12px 7px 16px}
.bt-vacia{color:var(--muted);font-size:13px;margin:0}
.bt-editor{display:flex;flex-direction:column;gap:10px;max-height:min(62vh,600px);overflow:auto;padding-right:4px}
.bt-ed-fila{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.bt-ed-fila label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.bt-ed-fila label.ancho2{grid-column:span 2}
.bt-ed-fila .bt-ed-acc{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.bt-ed-fila input[type=color]{height:30px;padding:0 2px;width:100%}
.bt-ed-paginas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.onda-caja{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.onda-titulo{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.btn.escucha{align-self:flex-start;margin-top:4px}
.btn.escucha.activa{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.previa-escucha{margin-top:6px}
canvas.onda{width:100%;height:90px;border-radius:10px;background:var(--bg);border:1px solid var(--border);cursor:crosshair}
.bt-ed-paginas .btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bt-ed-fila label.toggle{flex-direction:row;align-items:center;gap:8px;grid-column:span 2;color:var(--text);font-size:13px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--muted);font-size:13px}
.panel-h strong{color:var(--text);font-weight:600;font-size:14px}

/* Lista de cues */
.list{overflow:auto;flex:1;padding:6px}
.row{display:grid;grid-template-columns:40px 44px minmax(0,1fr) 92px 64px;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;position:relative;border:1px solid transparent}
.edicion .row{cursor:pointer}
.edicion .row:hover{background:var(--hover)}
.row .n{color:var(--dim);font:13px var(--mono);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row svg{width:20px;height:20px;color:var(--muted)}
.row .nm{min-width:0}
.row .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .out{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .du{font:13px var(--mono);color:var(--muted);text-align:right}
.row.standby{border-color:var(--accent);background:var(--card2)}
.row.standby .n{color:var(--accent);font-weight:700}
.row.standby::before{content:"";position:absolute;left:-1px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.row.playing svg,.row.playing .nm div{color:var(--ok)}
.row .prog{position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:var(--border);overflow:hidden}
.row .prog i{display:block;height:100%;background:var(--ok)}
.tag{font-size:11px;color:var(--dim);margin-left:6px}
.prep{font-size:11px;margin-left:6px;color:var(--dim)}
.prep.listo{color:var(--ok)}
.prep.error{color:var(--err)}
.lock{font-size:11px;color:var(--warn);margin-left:6px}
.vacio{color:var(--muted);text-align:center;padding:40px 16px}

/* Panel lateral: Edición */
.props{overflow:auto;flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;gap:10px}
.field label,.field .k{color:var(--muted);font-size:13px}
.field input[type=text],.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--text);font:inherit}
.field textarea{resize:vertical;min-height:54px}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.val{font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inline{display:flex;align-items:center;gap:10px;min-width:0}
.inline input[type=range]{flex:1;min-width:0}
.inline .val{flex:none;min-width:72px;text-align:right}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;min-width:0}
fieldset:disabled{opacity:.45}
.locked{background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--border));border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.locked p{margin:0}
.locked small{color:var(--muted)}
.note-small{font-size:12px;color:var(--dim)}

/* Panel lateral: Función */
.live{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.uno-acc{display:inline-flex;gap:6px;margin-top:8px}
.btn.chico{padding:3px 10px;font-size:12px;border-radius:8px}
.btn.parar-uno{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,var(--border))}
.aire-linea{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.aire-linea .uno-acc{margin-top:0}
.big{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.big .k{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.big .t{font-size:26px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.big .meta{color:var(--muted);font-size:13px;white-space:pre-wrap}
.big.now .t{color:var(--ok)}
.big.next{border-color:var(--accent)}
.remain{font:600 34px var(--mono)}
.bigbar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.bigbar i{display:block;height:100%;background:var(--ok)}
.nowlist{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--dim)}
.pausado{color:var(--warn);font-weight:600}

/* Transporte */
.transport{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
.go{min-height:76px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:30px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:16px;transition:background .15s,transform .05s;min-width:0}
.go:hover{background:var(--accent-h)}
.go:active{transform:scale(.99)}
.go small{font-size:13px;font-weight:500;letter-spacing:0;opacity:.75;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tb{border-radius:16px;border:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;min-height:76px}
.tb:hover{background:var(--hover)}
.tb span{font-weight:600}
.tb kbd{font-size:11px}
.tb[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
.panic{background:color-mix(in srgb,var(--err) 16%,var(--card));border-color:color-mix(in srgb,var(--err) 55%,var(--border));color:var(--err)}
.panic:hover{background:color-mix(in srgb,var(--err) 26%,var(--card))}

.credito{color:var(--dim);font-size:11px;text-align:right;margin-top:-6px}

/* Ventanitas (Acerca de, Atajos) */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40;padding:16px}
.dlg{background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:20px 22px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.dlg h2{margin:0;font-size:18px;font-weight:600}
.dlg p{margin:0;color:var(--muted)}
.dlg .accent{color:var(--accent);font-weight:600}
.dlg table{border-collapse:collapse;width:100%}
.dlg td{padding:5px 4px;border-bottom:1px solid var(--border)}
.dlg td:first-child{white-space:nowrap;width:1%}
.dlg .ok{align-self:flex-end;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:8px 18px;font-weight:600}
.dlg.ancho{width:min(780px,100%)}
.ajustes{max-height:min(60vh,560px);overflow:auto;padding-right:4px}
.ajustes h3{font-size:14px;margin:14px 0 4px}
.ajustes h3:first-child{margin-top:0}
.aj-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--border)}
.aj-fila label{display:flex;align-items:center;gap:6px}
.aj-valor{display:flex;align-items:center;gap:6px}
.aj-valor input[type=number]{width:90px;text-align:right}
.aj-valor input[type=range]{width:180px}
.aj-unidad{color:var(--muted);font-size:12px;min-width:18px}
.medios{max-height:min(46vh,420px);overflow:auto;border:1px solid var(--border);border-radius:12px;padding:6px;margin:10px 0}
.medio{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.medio:hover{background:var(--hover)}
.medio .ruta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acciones .esp{flex:1}
.acciones .ok{margin:0}
.dlg .ok:disabled{opacity:.45}
.soltar{position:fixed;inset:10px;z-index:60;border:2px dashed var(--accent);border-radius:18px;background:rgba(14,17,23,.82);display:grid;place-items:center;pointer-events:none;text-align:center}
.soltar strong{display:block;font-size:22px;margin-bottom:6px}
.soltar small{color:var(--muted);font-size:14px}
.inline.dos{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.mini-l{font-size:12px;color:var(--muted)}
input.tiempo{width:100%;min-width:0}
.vacio .btn{margin-top:10px}
body.moviendo,body.moviendo .row{cursor:grabbing;user-select:none}
.row.arrastrada{opacity:.45}
.row.caer-arriba{box-shadow:0 -2px 0 var(--accent)}
.row.caer-abajo{box-shadow:0 2px 0 var(--accent)}
.dlg .nav{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mapa{position:relative;width:100%;aspect-ratio:16/9;background:#05070b;border:1px solid var(--border);border-radius:12px;overflow:hidden;touch-action:none}
.mapa svg{position:absolute;inset:0;width:100%;height:100%}
.mapa .marco{fill:none;stroke:var(--dim);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.mapa .forma{fill:rgba(111,128,255,.18);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.mapa .asa{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fff;padding:0;cursor:grab;box-shadow:0 0 0 3px rgba(0,0,0,.45)}
.mapa .asa.sel{box-shadow:0 0 0 4px var(--accent);transform:scale(1.15)}
.mapa .asa.c0{background:#dc3232}.mapa .asa.c1{background:#32c850}.mapa .asa.c2{background:#3c5ae6}.mapa .asa.c3{background:#e6c828}
.encuadre{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:10px;margin-top:4px}
.encuadre .sub{font-weight:600}
.recortes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.recortes .mini{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.recortes input{width:100%;min-width:0}
.dlg .bars{height:40px;gap:5px}
.dlg .bars i{width:7px;border-radius:4px}

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .body,.transport{grid-template-columns:1fr}
  .list{max-height:420px}
  .row{grid-template-columns:34px 44px minmax(0,1fr) 54px}
  .row .out{display:none}
  .spacer{display:none}
}

/* Etapa 3C: consejos, Modo Ayuda, Primeros pasos */
.q{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;padding:0;vertical-align:middle;line-height:1}
.q:hover,.q[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.sin-consejos .q{display:none}
.field label{display:flex;align-items:center}
.globo{position:fixed;z-index:50;width:min(340px,calc(100% - 32px));background:var(--card2);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:6px;font-size:13px;pointer-events:none}
.globo h3{margin:0;font-size:14px;font-weight:600}
.globo p{margin:0;color:var(--text)}
.globo .k{color:var(--accent);font-weight:600;font-size:12px;margin-top:2px}
.globo .ej{color:var(--muted);font-style:italic}
.helpbar{display:none;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 14%,var(--card));border:1px solid var(--accent);border-radius:14px;padding:10px 14px}
.helpbar p{margin:0;font-size:15px}
.helping .helpbar{display:flex}
.helping [data-help]{outline:2px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px;cursor:help}
.helping [data-help]:hover{outline-style:solid}
.helping [data-help] *{cursor:help}
.burbuja{position:fixed;z-index:45;width:min(360px,calc(100% - 32px));background:var(--card2);border:1px solid var(--accent);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px}
.burbuja h3{margin:0;font-size:16px;font-weight:600}
.burbuja p{margin:0;font-size:15px;line-height:1.5}
.burbuja .ok,.dlg .nav button{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:6px 14px;font-weight:600;align-self:flex-end}
.dlg .nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg .nav .atras{background:var(--card);color:var(--text);border:1px solid var(--border)}
.dlg .nav span{color:var(--dim);font-size:12px}
.menu .q{margin-left:auto}
/* Vista Estudio y buscador */
.row svg{justify-self:center}
.mini{width:44px;height:25px;object-fit:cover;border-radius:4px;background:#000;display:block}
.buscador{padding:6px 6px 0}
.buscador input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--text);font:inherit}
.row.oculta{display:none}
.estudio{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.caja{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.caja.previa{border-color:var(--accent)}
.caja .k{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.pantalla{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#9098A8}
.pantalla video,.pantalla img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.pantalla .capa-aire{position:absolute;inset:0;opacity:0;display:grid;place-items:center}
.pantalla .rotulo{position:absolute;left:8px;bottom:6px;right:8px;color:#E9ECF2;font-size:13px;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aire .pantalla{max-height:150px;aspect-ratio:auto;height:150px}
.controles{display:flex;align-items:center;gap:8px}
.controles input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.controles .val{min-width:84px;text-align:right}
.salida-desde{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.salida-desde button{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px;color:var(--text)}
.salida-desde button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.caja .meta{white-space:pre-wrap;color:var(--muted);font-size:13px}

/* ===== Vista Estudio como OBS (aprobada el 22/10/2026) =====
   Arriba Vista previa | GO de transición | Programa; abajo paneles movibles.
   Relieve hecho con capas semitransparentes sobre los colores del tema (vale en
   Noche, Día, Fresno y Alto contraste). Sin desenfoque de fondo (caro).
   En «Liviano» se quitan brillos, sombras y animaciones. */
.app.estudio .col-izq,.app.estudio #lado,.app.estudio .transport{display:none}
.app.estudio .body{display:flex;flex-direction:column;min-height:0}
.est{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.est-mon{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 132px minmax(0,1fr);gap:10px}
.est-docks{flex:1.25 1 0;min-height:190px;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.dock[data-panel="escenas"]{--min:250px}.dock[data-panel="fuentes"]{--min:230px}.dock[data-panel="mezclador"]{--min:240px}
.dock[data-panel="transiciones"]{--min:180px}.dock[data-panel="controles"]{--min:160px}.dock[data-panel="botonera"]{--min:200px}.dock[data-panel="multivista"]{--min:460px}
.mon,.dock{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 40%,rgba(0,0,0,.12)),var(--card);border:1px solid var(--border);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.25),0 10px 24px -10px rgba(0,0,0,.7)}
.mon{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.mon.previa{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent),0 0 26px -8px var(--accent),0 12px 26px -10px rgba(0,0,0,.8)}
.mon.programa{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px color-mix(in srgb,var(--err) 65%,transparent),0 0 30px -6px var(--err),0 12px 26px -10px rgba(0,0,0,.8)}
.mon-k{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.mon-k strong{color:var(--text);font-size:13px}
.mon-k .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon-k .r{margin-left:auto;white-space:nowrap;font-size:11px}
.mon-k .r.alerta{color:var(--warn);font-weight:700}
.mon-k .r.vivo{color:var(--err);font-weight:800;letter-spacing:.04em;text-shadow:0 0 10px color-mix(in srgb,var(--err) 70%,transparent)}
.tally{width:9px;height:9px;border-radius:50%;flex:none}
.tally.p{background:var(--accent);box-shadow:0 0 6px var(--accent),0 0 14px var(--accent)}
.tally.a{background:var(--err);box-shadow:0 0 6px var(--err),0 0 16px var(--err);animation:latido 1.6s infinite}
@keyframes latido{50%{opacity:.5}}
.mon .pantalla{flex:1;min-height:60px;aspect-ratio:auto;border:4px solid #07090d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 8px 18px rgba(0,0,0,.45)}
.mon .pantalla::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,0) 32%);z-index:1;pointer-events:none}
.mon .pantalla .rotulo{z-index:2;left:10px;bottom:8px;right:auto;background:rgba(8,10,14,.6);border:1px solid rgba(255,255,255,.12);padding:2px 8px;border-radius:6px;font-weight:600}
.mon .pantalla .t{position:absolute;right:10px;top:8px;z-index:2;font-size:14px;font-weight:700;background:rgba(8,10,14,.62);border:1px solid rgba(255,255,255,.14);padding:2px 9px;border-radius:7px;color:#E9ECF2}
.mon .pantalla .t:empty{display:none}
.mon .pantalla .t.amarillo{color:#ffd47a;border-color:rgba(255,212,122,.6);box-shadow:0 0 12px rgba(232,194,90,.6)}
.mon .pantalla .t.rojo{color:#fff;background:rgba(200,50,44,.85);border-color:#ffb3ae;box-shadow:0 0 14px rgba(242,122,116,.8)}
.mon.programa.destello .pantalla::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);animation:barrido .6s ease-out forwards}
@keyframes barrido{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.mon .controles{gap:6px}
.mon .salida-desde{gap:6px}
.mon .meta{font-size:12px;max-height:3.6em;overflow:hidden}
.aire-lista{display:flex;flex-direction:column;gap:4px;max-height:none!important}
.aire-linea{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.08)),var(--card2)}
.aire-linea>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Centro: GO de la transición, palanca T y corte rápido */
.est-centro{display:flex;flex-direction:column;justify-content:center;gap:7px;min-height:0;overflow:hidden}
.est-centro .tbar{flex:1 1 86px;min-height:50px;height:auto;max-height:110px}
.est-centro .flecha{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.go-t{border:1px solid color-mix(in srgb,var(--accent) 70%,#fff);border-radius:16px;padding:14px 6px 10px;color:var(--on-accent);font-size:26px;font-weight:800;letter-spacing:.06em;
  background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--accent) 55%,#fff),var(--accent) 45%,color-mix(in srgb,var(--accent) 70%,#000));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -6px 12px rgba(0,0,0,.25),0 5px 0 color-mix(in srgb,var(--accent) 45%,#000),0 12px 26px -6px color-mix(in srgb,var(--accent) 80%,transparent);transform:translateY(-3px);transition:transform .06s,box-shadow .06s}
.go-t:active{transform:translateY(1px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 1px 0 color-mix(in srgb,var(--accent) 45%,#000)}
.go-t small{display:block;font-size:10px;font-weight:600;letter-spacing:.02em;opacity:.9;margin-top:2px}
.tbar{display:flex;align-items:stretch;gap:5px;height:86px}
.tbar .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:var(--dim);text-align:center}
.tbar .riel{flex:1;position:relative;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--border);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);cursor:ns-resize;touch-action:none}
.tbar .riel::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:3px;margin-left:-1.5px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--err));opacity:.55}
.tbar .riel i{position:absolute;left:3px;right:3px;top:-9px;height:18px;border-radius:5px;background:linear-gradient(180deg,#f4f6fb,#9aa1b3);border:1px solid #6b7285;box-shadow:0 3px 6px rgba(0,0,0,.55)}
.tbar.activa .riel{box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 1px var(--accent)}
.corte-rapido{border-radius:10px;padding:6px 4px;font-weight:700;font-size:12px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.15)),var(--card2);border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.45)}
.mini-tr{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.mini-tr button{border:1px solid var(--border);border-radius:7px;padding:3px 0;font-size:10px;color:var(--muted);background:var(--card)}
.mini-tr button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.mini-tr .ms{grid-column:1/-1;text-align:center;font-size:11px;color:var(--muted)}
/* Paneles */
.dock{flex:var(--w,1) 1 0;min-width:var(--min,190px);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.dock h3{margin:0;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 4px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0))}
.dock h3 .titulo{white-space:nowrap}
.dock h3 .r{margin-left:auto;color:var(--muted);font-weight:400;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cerrar-panel{border:0;background:none;color:var(--dim);font-size:15px;line-height:1;padding:0 4px;margin-left:4px;cursor:pointer;border-radius:6px}
.cerrar-panel:hover{color:var(--text);background:var(--hover)}
.paneles-bloqueados .grip{visibility:hidden}
.grip{border:0;background:none;color:var(--dim);font-size:13px;letter-spacing:-2px;padding:0 5px;cursor:grab;touch-action:none;border-radius:6px}
.grip:hover,.grip:focus-visible{color:var(--accent)}
.dock-c{flex:1;min-height:0;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:5px}
.dock.levantado{z-index:20;box-shadow:0 0 0 2px var(--accent),0 24px 46px rgba(0,0,0,.7);opacity:.95;pointer-events:none}
.dock.destino.antes{box-shadow:-4px 0 0 var(--accent)}
.dock.destino.despues{box-shadow:4px 0 0 var(--accent)}
.dock .buscador{padding:0}
.dock .list{padding:0}
.dock .row{grid-template-columns:30px 44px minmax(0,1fr) 46px}
.dock .row .out{display:none}
.dock .row.standby{box-shadow:inset 0 0 0 1px var(--accent),0 0 12px -4px var(--accent)}
.dock .row.playing{background:linear-gradient(90deg,color-mix(in srgb,var(--err) 20%,transparent),transparent)}
.dock #botonera{border:0;border-radius:0;background:none;box-shadow:none;max-height:none;flex:1}
.dock #botonera>.panel-h{padding:0 0 6px;border:0}
.dock #botonera>.panel-h>strong{display:none}
.est-estado{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.est-estado b{color:var(--muted);font-weight:500}
/* Fuentes */
.fuente{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:7px;padding:5px 6px;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.08)),var(--card2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.fuente .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--on-accent);background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--accent) 55%,#fff),var(--accent))}
.fuente .fx{min-width:0;display:flex;flex-direction:column}
.fuente .fx>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.fuente small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fuente-error{color:var(--err);font-size:12px;margin:0}
.fuentes .pie{margin-top:4px}
.prop-t{margin-top:8px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:6px}
.dock .detalle{padding:0}
.dock .detalle .props{padding:6px 0}
.dock .detalle .panel-h{display:none}
/* Mezclador: medidores LED con pico retenido y faders con perilla */
.canal{display:grid;grid-template-columns:74px minmax(0,1fr) 58px;align-items:center;gap:6px;font-size:12px}
.canal .k{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canal.maestro .k{color:var(--text);font-weight:700}
.canal .fader2{grid-column:2/4;display:grid;grid-template-columns:minmax(0,1fr) 58px;align-items:center;gap:6px}
.leds{display:flex;flex-direction:column;gap:2px}
.led{position:relative;height:6px;border-radius:2px;background:rgba(0,0,0,.35);overflow:hidden}
.led i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.55) 3px 4px),linear-gradient(90deg,var(--ok) 0 70%,var(--warn) 70% 90%,var(--err) 90%);background-size:100% 100%,var(--ancho-led,100%) 100%}
.led b{position:absolute;top:0;bottom:0;width:2px;background:var(--text)}
.escala{display:flex;justify-content:space-between;color:var(--dim);font-size:9px;margin:0 64px 0 80px}
.sep{height:1px;background:var(--border);margin:3px 0}
.mz-voces{display:flex;flex-direction:column;gap:5px}
.fader2{outline:none}
.fader2 .riel{position:relative;height:6px;border-radius:3px;background:rgba(0,0,0,.4);box-shadow:inset 0 1px 3px rgba(0,0,0,.7);cursor:pointer;touch-action:none;margin:6px 0}
.fader2 .riel .lleno{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 50%,#000),var(--accent));transition:width .08s linear}
.fader2 .riel .perilla{position:absolute;top:-6px;width:14px;height:18px;margin-left:-7px;border-radius:4px;background:linear-gradient(180deg,#f4f6fb,#9aa1b3);border:1px solid #6b7285;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.55);transition:left .08s linear}
.fader2.moviendo .riel .lleno,.fader2.moviendo .riel .perilla{transition:none}
.fader2:focus-visible .riel{box-shadow:0 0 0 2px var(--accent)}
.fader2 .val{color:var(--muted);font-size:11px;text-align:right;white-space:nowrap}
/* Transiciones */
.opc{display:flex;flex-direction:column;gap:5px}
.opc-b{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:9px;border:1px solid var(--border);font-size:12px;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.1)),var(--card2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 rgba(0,0,0,.35)}
.opc-b.on{border-color:var(--accent);color:var(--accent);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 10px -2px var(--accent)}
.dur{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.dur-v{margin-left:auto;display:flex;align-items:center;gap:4px}
.dur-v input{width:74px}
/* Controles (GO, Pausa, Fundir todo, Parar todo) dentro de su panel */
.dock #go{min-height:54px;font-size:22px;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 color-mix(in srgb,var(--accent) 45%,#000)}
.dock #go small{display:none}
.dock .side-btns{grid-template-columns:1fr;gap:6px}
.dock .side-btns .tb{min-height:34px;flex-direction:row;justify-content:space-between;padding:6px 10px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.4)}
.dock .side-btns .panic{background:linear-gradient(180deg,color-mix(in srgb,var(--err) 85%,#fff),var(--err));color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 color-mix(in srgb,var(--err) 50%,#000),0 0 14px -3px var(--err)}
/* Multivista */
.mv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:11px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--border)}
.mv-grp{display:flex;align-items:center;gap:5px}
.seg2{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg2 button{border:0;border-right:1px solid var(--border);background:var(--card2);padding:2px 7px;font-size:11px;color:var(--muted)}
.seg2 button:last-child{border-right:0}
.seg2 button.on{color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 14%,var(--card2))}
.mv-chip{border:1px solid var(--border);border-radius:8px;padding:2px 8px;font-size:11px;background:var(--card2);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
.mv-chip.falta{color:var(--warn)}
.mv-sel{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:11px;padding:2px 4px}
.mv{display:flex;flex-direction:column;gap:8px}
.mv-grupo{display:flex;flex-direction:column;gap:5px;border-radius:10px;padding:2px}
.mv-grupo.mv-destino{box-shadow:0 0 0 2px var(--accent)}
.mv-gh{display:flex;align-items:center;gap:6px}
.mv-gnom{background:none;border:0;border-bottom:1px dashed transparent;color:var(--muted);font:600 11px var(--font);letter-spacing:.03em;padding:1px 2px;min-width:0;flex:1}
.mv-gnom:hover,.mv-gnom:focus{border-bottom-color:var(--border);color:var(--text)}
.mv-gx{border:0;background:none;color:var(--dim);font-size:11px}
.mv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--mv-ancho,192px),1fr));gap:7px}
.mv-vacio{grid-column:1/-1;border:1px dashed var(--border);border-radius:9px;padding:10px;text-align:center;color:var(--dim);font-size:11px}
.mv-tile{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#000;border:2px solid var(--border);box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);cursor:pointer;user-select:none;touch-action:none}
.mv-tile::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.12),transparent 35%);z-index:1;pointer-events:none}
.mv-tile img.mv-foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mv-ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 18%,#141925),#0b0e14)}
.mv-ic svg{width:36%;height:36%}
.mv-tile.prev{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 16px -2px var(--accent)}
.mv-tile.aire{border-color:var(--err);box-shadow:0 0 0 1px var(--err),0 0 16px -2px var(--err)}
.mv-tile.suena{border-color:color-mix(in srgb,var(--ok) 70%,var(--border))}
.mv-tile.falla{border-color:#a0403a}
.mv-tile.levantada{z-index:30;box-shadow:0 0 0 2px var(--accent),0 18px 30px rgba(0,0,0,.75);pointer-events:none}
.mv-tile.mv-destino.antes{box-shadow:-4px 0 0 var(--accent)}
.mv-tile.mv-destino.despues{box-shadow:4px 0 0 var(--accent)}
.mv-tal{position:absolute;top:4px;left:4px;z-index:2;font-size:9px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:4px;color:#fff;background:var(--accent)}
.mv-tile.aire .mv-tal{background:var(--err)}
.mv-x{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:#ffb3ae;font-size:11px;font-weight:700;background:rgba(40,10,10,.55);text-align:center;padding:4px}
.mv-acc{position:absolute;top:4px;right:4px;z-index:3;display:flex;gap:3px}
.mv-b{font-size:10px;line-height:1;padding:3px 5px;border-radius:5px;background:rgba(10,12,18,.72);border:1px solid rgba(255,255,255,.2);color:#E9ECF2}
.mv-b.on{background:color-mix(in srgb,var(--accent) 85%,#000);border-color:#b8c0ff}
.mv-b.au{background:var(--ok);color:#05150d;border-color:#b8f0d6}
.mv-lab{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:4px;padding:12px 6px 4px;font-size:11px;font-weight:600;color:#E9ECF2;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent)}
.mv-lab b{color:#c4cad6}
.mv-lab .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-lab .d{color:#aab1c0;font-weight:500}
.mv-prog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:3;background:rgba(255,255,255,.15)}
.mv-prog i{position:absolute;inset:0 auto 0 0;background:var(--err)}
.mv-leyenda{font-size:10px;color:var(--dim);margin-top:2px}
/* Editor de atajos y distribuciones */
.at-juegos{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.at-lista{display:flex;flex-direction:column;gap:4px;max-height:56vh;overflow:auto;padding-right:4px}
.at-lista h3{margin:10px 0 2px;font-size:13px;color:var(--muted)}
.at-fila{display:grid;grid-template-columns:minmax(0,1fr) 150px 92px;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;background:var(--card)}
.at-fila.apagado{opacity:.6}
.at-fila .at-aviso{grid-column:1/-1;color:var(--warn);font-size:11px}
.at-fila .at-aviso:empty{display:none}
.at-nom{display:flex;align-items:center;font-size:13px}
.at-tecla{font:12px var(--mono);background:var(--card2);border:1px solid var(--border);border-bottom-width:2px;border-radius:7px;padding:3px 8px}
.at-tecla.esperando{border-color:var(--accent);color:var(--accent)}
.at-raton{font-size:11px;color:var(--muted)}
.dist-lista{display:flex;flex-direction:column;gap:5px}
.dist-f{display:flex;align-items:center;gap:8px}
.dist-f>span{flex:1}
.dist-nueva{display:flex;gap:8px;align-items:center}
.dist-nueva input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:6px 9px;color:var(--text);font:inherit}
/* Modo cabina: solo monitores, escenas y controles */
.app.cabina .menubar,.app.cabina .top,.app.cabina .credito,.app.cabina .est-estado{display:none}
/* Liviano: sin brillos, sombras ni animaciones */
:root.liviano *,:root.liviano *::before,:root.liviano *::after{animation:none!important;transition:none!important}
:root.liviano .mon,:root.liviano .dock,:root.liviano .go-t,:root.liviano .mv-tile,:root.liviano .opc-b,:root.liviano .fuente{box-shadow:none!important}
:root.liviano .mon .pantalla::before,:root.liviano .mv-tile::before{display:none}
@media (max-width:900px){
  .est-mon{grid-template-columns:1fr;grid-auto-rows:minmax(180px,auto)}
  .est-docks{flex-direction:column;overflow:visible}
  .dock{min-height:200px}
}
</style>

        <button role="menuitem" data-orden="deshacer" data-edita="deshacer"><span data-t="deshacer"></span> <kbd>Ctrl Z</kbd></button>

        <button role="menuitem" data-accion="bajar" data-edita="cue"><span data-t="bajar_cue"></span> <kbd>Alt ↓</kbd></button>
        <div class="sep"></div>
        <button role="menuitem" disabled><span data-t="copiar"></span> <span class="pronto" data-t="proximamente"></span></button>
        <button role="menuitem" disabled><span data-t="pegar"></span> <span class="pronto" data-t="proximamente"></span></button>
        <div class="sep"></div>
        <button role="menuitem" data-accion="ed_botonera" data-edita="si" data-consejo="botonera"><span data-t="botonera_menu"></span><span class="q" aria-hidden="true">?</span></button>
        <button role="menuitem" data-accion="ajustes" data-consejo="ajustes_show"><span data-t="ajustes_show"></span><span class="q" aria-hidden="true">?</span></button>
      </div>
    </div>

<script>
(function () {
  "use strict";
  // Textos en español e inglés: los pone el motor al servir la página (ui/textos.json).
  var TEXTOS = "__TEXTOS__";
  var token = new URLSearchParams(location.search).get("t") || "";
  var ws = null, abierto = false, e = null;
  var desbloqueado = null;   // cue que se puede editar aunque suene
  var ladoClave = "";        // qué muestra el panel lateral (para no redibujar mientras se escribe)
  var $ = function (id) { return document.getElementById(id); };

  // ---- Preferencias de esta ventana (pasarán a los perfiles de operador) ----
  function leer(k, def) { try { var v = localStorage.getItem(k); return v === null ? def : v; } catch (x) { return def; } }
  function escribir(k, v) { try { localStorage.setItem(k, v); } catch (x) {} }
  var idioma = leer("ota-idioma", "es") === "en" ? "en" : "es";
  var consejos = leer("ota-consejos", "si") !== "no";
  var tema = leer("ota-tema", "");
  // Estilo de trabajo: "lista" (como QLab) o "estudio" (como OBS). Vista previa en movimiento o fija.
  var estilo = leer("ota-estilo", "lista") === "estudio" ? "estudio" : "lista";
  // Vista previa en movimiento: el vídeo arranca solo al elegirlo (apagado por defecto: queda en su primer cuadro y se le da ▶).
  var previaMov = leer("ota-previa-mov", "no") === "si";
  var busqueda = "";

  // ---- Textos ----
  function T(k, vars) {
    var s = (TEXTOS[idioma] && TEXTOS[idioma].ui[k]) || (TEXTOS.es.ui[k]) || k;
    if (vars) for (var v in vars) s = s.split("{" + v + "}").join(vars[v]);
    return s;
  }
  // Un texto cuyo nombre se arma con un prefijo (así la prueba de textos no lo confunde con un nombre que falta).
  function Tp(prefijo, k) { return T(prefijo + k); }
  function ayudaDe(k) { return TEXTOS[idioma].ayuda[k]; }
  function aplicarTextos() {
    document.documentElement.lang = idioma;
    document.querySelectorAll("[data-t]").forEach(function (x) { x.textContent = T(x.dataset.t); });
    document.querySelectorAll("[data-t-title]").forEach(function (x) { x.title = T(x.dataset.tTitle); });
    $("segModo").setAttribute("aria-label", T("modo_grupo"));
    $("lista").setAttribute("aria-label", T("lista_cues"));
    $("aviso-cerrar").setAttribute("aria-label", T("cerrar_aviso"));
    $("buscar").placeholder = T("buscar_ph");
    $("buscar").setAttribute("aria-label", T("atajo_buscar"));
    document.querySelectorAll("[data-idioma]").forEach(function (b) { b.setAttribute("aria-checked", String(b.dataset.idioma === idioma)); });
    if (!abierto) avisoConexion(T("conectando"), "");
    else avisoConexion(T("conectado"), "on");
    ladoClave = "";
    if (e) dibujar();
  }

  // ---- Ayudantes para crear elementos sin HTML ----
  function el(tag, cls, texto) {
    var x = document.createElement(tag);
    if (cls) x.className = cls;
    if (texto != null) x.textContent = texto;
    return x;
  }
  var SVG = "http://www.w3.org/2000/svg";
  function icono(tipo) {
    var s = document.createElementNS(SVG, "svg");
    s.setAttribute("viewBox", "0 0 20 20"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "1.7"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("aria-hidden", "true");
    var d = { audio: ["M3 9v2M6.5 6v8M10 3v14M13.5 7v6M17 9v2"],
              video: ["M4.5 4.5h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z", "M8.5 7.8v4.4l3.8-2.2z"],
              imagen: ["M4.5 4.5h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z", "M4.5 13.5l4-4 3 3 2-2 2 2"] }[tipo] || [];
    d.forEach(function (p) { var q = document.createElementNS(SVG, "path"); q.setAttribute("d", p); s.appendChild(q); });
    return s;
  }
  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function tipoTexto(t) { return T({ audio: "audio", video: "video", imagen: "imagen" }[t] || "audio"); }
  function salidaTexto(s) { return s === "Auriculares" ? T("auriculares") : T("principal"); }
  function prepTexto(p) { return { listo: T("listo"), preparando: T("preparando"), error: T("no_reproducible") }[p] || ""; }

  function mandar(orden, extra) {
    if (!abierto) return;
    var m = { orden: orden };
    if (extra) for (var k in extra) m[k] = extra[k];
    ws.send(JSON.stringify(m));
  }

  // ---- Dibujo ----
  function sonandoPorCue() {
    var m = {};
    (e.sonando || []).forEach(function (s) { if (!m[s.cue] || !s.fundiendo) m[s.cue] = s; });
    return m;
  }

  function dibujar() {
    var funcion = e.modo === "funcion";
    $("app").classList.toggle("edicion", !funcion);
    $("mEdicion").setAttribute("aria-pressed", String(!funcion));
    $("mFuncion").setAttribute("aria-pressed", String(funcion));
    $("nombre").textContent = e.show || "Otaconvert V2";
    document.title = (e.show ? e.show + " · " : "") + "Otaconvert V2";
    $("subtitulo").textContent = T("n_cues", { n: e.cues.length }) + " · " + (e.sucio ? T("sin_guardar") : T("guardado"));
    $("top").classList.toggle("busy", (e.sonando || []).length > 0 && !e.pausado);
    $("aviso").hidden = !(avisoPropio || e.aviso);
    $("aviso-texto").textContent = avisoPropio || e.aviso;
    $("pausa").setAttribute("aria-pressed", String(!!e.pausado));
    // Menú Edición (etapa 5A): en Función no se cambia el show.
    document.querySelectorAll("[data-edita]").forEach(function (b) {
      var k = b.dataset.edita;
      b.disabled = funcion || (k === "deshacer" && !e.puede_deshacer) || (k === "rehacer" && !e.puede_rehacer) || (k === "cue" && !e.cues[e.en_espera]);
    });
    $("soltar-texto").textContent = funcion ? T("soltar_funcion") : T("soltar_s");
    // Multivista, Modo cabina y Distribuciones son de la Vista Estudio.
    document.querySelectorAll("[data-solo-estudio]").forEach(function (b) { b.disabled = estilo !== "estudio" || b.dataset.siempre === "si"; });
    actualizarAjustes();
    pintarLuz();
    dibujarBotonera();
    actualizarMapeo();
    var nx = e.cues[e.en_espera];
    $("goNext").textContent = nx ? nx.numero + " · " + nx.nombre : T("fin_lista");
    if (!e.con_sonido) avisoConexion(T("sin_sonido"), "warn");
    else if (!e.con_proyeccion) avisoConexion(T("sin_proyeccion"), "warn");
    $("lado").dataset.help = funcion ? "lado_funcion" : "lado_edicion";
    dibujarLista();
    dibujarLado(funcion);
  }

  function dibujarLista() {
    var lista = $("lista"), arriba = lista.scrollTop;
    var son = sonandoPorCue();
    lista.textContent = "";
    $("info").textContent = T("n_cues", { n: e.cues.length }) + " · " + T("n_sonando", { n: (e.sonando || []).length });
    if (!e.cues.length) {
      var va = el("div", "vacio");
      va.appendChild(el("p", "", T("vacio")));
      if (e.modo !== "funcion") {
        va.appendChild(el("p", "note-small", T("vacio_agregar")));
        var ba = el("button", "btn", T("agregar_cues")); ba.type = "button"; ba.onclick = dialogoAgregar;
        va.appendChild(ba);
      }
      lista.appendChild(va);
      return;
    }
    var funcion = e.modo === "funcion";
    var elegible = !funcion || estilo === "estudio";
    var visibles = 0;
    e.cues.forEach(function (c, i) {
      var s = son[i];
      var oculta = busqueda && !coincide(c, busqueda);
      if (!oculta) visibles++;
      var f = el("div", "row" + (i === e.en_espera ? " standby" : "") + (s ? " playing" : "") + (oculta ? " oculta" : ""));
      f.dataset.i = i;
      if (elegible) f.tabIndex = 0;
      f.appendChild(el("span", "n", c.numero));
      // Foto chica del vídeo o imagen (si ya está hecha); si no, el icono del tipo.
      if (c.miniatura) {
        var im = el("img", "mini"); im.alt = ""; im.loading = "lazy"; im.src = urlMiniatura(i, c);
        f.appendChild(im);
      } else {
        f.appendChild(icono(c.tipo));
      }
      var nm = el("span", "nm"), linea = el("div");
      linea.appendChild(document.createTextNode(c.nombre));
      if (c.bucle) linea.appendChild(el("span", "tag", T("bucle")));
      if (c.preparacion) {
        var pr = el("span", "prep " + c.preparacion, prepTexto(c.preparacion));
        if (c.error) pr.title = c.error;
        linea.appendChild(pr);
      }
      if (s && !funcion && desbloqueado !== i) linea.appendChild(el("span", "lock", T("sonando_tag")));
      nm.appendChild(linea);
      nm.appendChild(el("small", "", c.nota || c.archivo));
      f.appendChild(nm);
      f.appendChild(el("span", "out", c.tipo === "audio" ? salidaTexto(c.salida) : T("proyector")));
      f.appendChild(el("span", "du num", c.tipo === "imagen" ? "—" : (c.duracion_s != null ? mmss(c.duracion_s) : "")));
      if (s) { var p = el("span", "prog"), b = el("i"); b.style.width = (s.progreso * 100) + "%"; p.appendChild(b); f.appendChild(p); }
      lista.appendChild(f);
    });
    if (busqueda && !visibles) lista.appendChild(el("div", "vacio", T("sin_coincidencias")));
    lista.scrollTop = arriba;
    var sb = lista.querySelector(".standby:not(.oculta)");
    if (sb) sb.scrollIntoView({ block: "nearest" });
  }

  // ---- Buscador: número o nombre, sin importar mayúsculas ni tildes ----
  function sinTildes(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function coincide(c, q) {
    var b = sinTildes(q).trim();
    return !b || sinTildes(c.numero) === b || sinTildes(c.numero + " " + c.nombre + " " + c.nota + " " + c.archivo).indexOf(b) >= 0;
  }
  function urlMiniatura(i, c) { return "/miniatura?t=" + encodeURIComponent(token) + "&cue=" + i + "&v=" + encodeURIComponent(c.miniatura || ""); }
  function urlMedio(i) { return "/medio?t=" + encodeURIComponent(token) + "&cue=" + i; }

  // Botoncito "?" con el consejo de una opción (regla de interfaz de CLAUDE.md).
  function botonConsejo(k) {
    var b = el("button", "q", "?");
    b.type = "button";
    b.dataset.consejo = k;
    b.setAttribute("aria-label", T("consejo_boton"));
    b.setAttribute("aria-expanded", "false");
    return b;
  }

  // Panel lateral. En Edición: el cue en espera, editable. En Función: lo que suena y lo que viene.
  function dibujarLado(funcion) {
    if (estilo === "estudio") { dibujarEstudio(funcion); return; }
    var lado = $("lado");
    desarmarEstudio();
    if (funcion) { ladoClave = ""; dibujarEnVivo(lado); return; }
    dibujarDetalle(lado);
  }

  // Ajustes del cue en espera (Edición), dentro de `lado`.
  function dibujarDetalle(lado) {
    var i = e.en_espera, c = e.cues[i];
    var suena = !!sonandoPorCue()[i];
    var clave = JSON.stringify([i, c, suena, desbloqueado, idioma, consejos, e.escucha]);
    // No se redibuja mientras se escribe en el panel: se perdería lo escrito.
    if (clave === ladoClave || lado.contains(document.activeElement) && document.activeElement.matches("input[type=text],input[type=number],textarea")) return;
    ladoClave = clave;
    lado.textContent = "";
    var h = el("div", "panel-h");
    if (!c) {
