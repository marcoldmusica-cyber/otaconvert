name: Compilar Otaconvert

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Instalar Inno Setup (solo Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Compilar y autoprobar
        run: python build.py
        env:
          OTA_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Otaconvert-${{ runner.os }}
          path: dist/release/*
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
