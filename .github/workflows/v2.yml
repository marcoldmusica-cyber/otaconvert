name: Compilar Otaconvert V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"
  # Cada lunes: revisar si alguna librería usada tiene una vulnerabilidad nueva.
  schedule:
    - cron: "0 6 * * 1"

# Seguridad: el token de GitHub solo puede leer el repositorio.
permissions:
  contents: read

# Seguridad: las acciones de terceros van fijadas por su commit (SHA), no
# por etiqueta, para que nadie pueda cambiar lo que se ejecuta aquí.
#   actions/checkout        v7.0.1
#   actions/upload-artifact v7.0.2

jobs:
  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Versión de Rust
        run: rustc --version; cargo --version

      - name: Compilar
        run: cargo build --release --locked

      - name: Pruebas automáticas
        run: cargo test --release --locked

      - name: Comprobar runtime de C y carga segura de DLL
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          foreach ($exe in "target\release\otaconvert-motor.exe", "target\release\otaconvert-ventana.exe") {
          $deps = & $dumpbin.FullName /nologo /dependents $exe
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') {
            Write-Error "$exe depende del runtime de C externo"
            exit 1
          }
          # El cargador de WebView2 debe ir dentro de la ventana (estático con MSVC).
          if ($deps -match 'WebView2Loader') {
            Write-Error "$exe depende de WebView2Loader.dll externa"
            exit 1
          }
          $cfg =& $dumpbin.FullName /nologo /loadconfig $exe | Select-String -Pattern 'Dependent Load Flag'
          $cfg
          if (-not ($cfg -match '800')) {
            Write-Error "$exe : falta /DEPENDENTLOADFLAG:0x800 (carga de DLL solo desde System32)"
            exit 1
          }
          }
          # Permiso de licencia: el cargador de WebView2 solo puede estar en la
          # ventana, nunca en el motor (que carga libmpv, GPL de terceros).
          $arbol = cargo tree --locked -p otaconvert-motor -e normal,build --target x86_64-pc-windows-msvc
          if ($arbol -match 'webview2') {
            Write-Error "El motor depende del cargador de WebView2"
            exit 1
          }
          if (-not ((cargo tree --locked -p otaconvert-ventana -e normal --target x86_64-pc-windows-msvc) -match 'webview2-com-sys')) {
            Write-Error "La comprobación de WebView2 no ve el cargador en la ventana: revisar"
            exit 1
          }

      # SignPath exige que el producto se llame como el proyecto y que la
      # versión sea la del código.
      - name: Comprobar datos de versión del exe
        shell: pwsh
        run: |
          $esperada = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          foreach ($exe in "target\release\otaconvert-motor.exe", "target\release\otaconvert-ventana.exe") {
            $v = (Get-Item $exe).VersionInfo
            $v | Select-Object ProductName, FileDescription, ProductVersion, FileVersion | Format-List
            if ($v.ProductName -ne 'Otaconvert' -or $v.ProductVersion -ne $esperada) {
              Write-Error "$exe : datos de versión incorrectos (esperado Otaconvert $esperada)"
              exit 1
            }
          }

      - name: Probar el ejecutable
        run: |
          target\release\otaconvert-motor.exe --version
          target\release\otaconvert-motor.exe --listar-salidas
          target\release\otaconvert-motor.exe --listar-pantallas

      # La ventana arranca (sin DLL que falten) y rechaza una dirección falsa.
      - name: Probar la ventana
        shell: pwsh
        run: |
          # Es un programa sin consola: PowerShell no lo espera si se llama directo.
          Set-Content -Path falsa.txt -Value "http://malo.com/?t=x"
          $p = Start-Process -FilePath target\release\otaconvert-ventana.exe -RedirectStandardInput falsa.txt -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 2) { Write-Error "La ventana no rechazó la dirección falsa (código $($p.ExitCode))"; exit 1 }
          "La ventana rechazó la dirección falsa: bien"

      # Dependencias de terceros desde la copia propia (Release
      # "dependencias-2026-10-15" de este repositorio), comprobadas por su huella.
      # Origen: libmpv y FFmpeg de shinchiro/mpv-winbuild-cmake 20261015;
      # Vulkan Runtime 1.4.363.0 de LunarG.
      - name: Descargar libmpv y Vulkan (versiones fijadas)
        shell: pwsh
        env:
          MPV_URL: https://github.com/marcoldmusica-cyber/otaconvert/releases/download/dependencias-2026-10-15/mpv-dev-x86_64-20261015-git-492bae0768.7z
          VK_URL: https://github.com/marcoldmusica-cyber/otaconvert/releases/download/dependencias-2026-10-15/vulkan-runtime-components-1.4.363.0.zip
          VK_SHA256: a25a927aa8b9f0371048f1861cf88ac3b9bc9b1fb332c42d897c8ab32695769a
          MPV_SHA256: 5db58c1768587b35f2d8daa11b53de4aec58197c00ea1d676f998f183a358ba8
        run: |
          Invoke-WebRequest $env:MPV_URL -OutFile mpv-dev.7z
          $h = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash
          if ($h -ne $env:MPV_SHA256) { Write-Error "libmpv: huella distinta ($h)"; exit 1 }
          7z x mpv-dev.7z -ompv-dev libmpv-2.dll | Out-Null
          Copy-Item mpv-dev\libmpv-2.dll target\release\
          Invoke-WebRequest $env:VK_URL -OutFile vk.zip
          $h = (Get-FileHash vk.zip -Algorithm SHA256).Hash
          if ($h -ne $env:VK_SHA256) { Write-Error "vulkan: huella distinta ($h)"; exit 1 }
          Expand-Archive vk.zip -DestinationPath vk
          Copy-Item (Get-ChildItem vk -Recurse -Filter vulkan-1.dll | Where-Object FullName -like '*\x64\*').FullName target\release\
          Copy-Item (Get-ChildItem vk -Recurse -Filter VulkanRT-License.txt).FullName target\release\VulkanRT-Licencia.txt
          Copy-Item ..\LICENSE-EXCEPTION-WEBVIEW2.txt target\release\

      # El equipo de GitHub no tiene tarjeta gráfica: la prueba de vídeo puede
      # no funcionar aquí. Se ejecuta para ver hasta dónde llega; la que manda
      # es la del equipo real.
      - name: Componentes (informativa)
        continue-on-error: true
        run: target\release\otaconvert-motor.exe --comprobar

      # FFmpeg desde la copia propia, fijado por su huella. Solo se usa aquí
      # para crear los vídeos de prueba; no va dentro del programa.
      - name: Crear vídeos de prueba
        shell: pwsh
        env:
          FF_URL: https://github.com/marcoldmusica-cyber/otaconvert/releases/download/dependencias-2026-10-15/ffmpeg-x86_64-git-ee8cbd7db.7z
          FF_SHA256: dc123b3ef138915c7c7b9fd1afaddce815c3163c496a5eaa63cf7945e7e475ab
        run: |
          Invoke-WebRequest $env:FF_URL -OutFile ff.7z
          $h = (Get-FileHash ff.7z -Algorithm SHA256).Hash
          if ($h -ne $env:FF_SHA256) { Write-Error "ffmpeg: huella distinta ($h)"; exit 1 }
          7z x ff.7z -off ffmpeg.exe | Out-Null
          $ff = "ff\ffmpeg.exe"
          $p = "paquete\Otaconvert-Prueba-de-hardware"
          New-Item -ItemType Directory -Force "$p\pruebas\1080p" | Out-Null
          foreach ($c in 'D04848','48B060','4868D0','D0B848','B848B8','48B8B8') {
            & $ff -hide_banner -loglevel error -y -f lavfi -i "color=c=0x$($c):s=1920x1080:r=60:d=6" -f lavfi -i "testsrc2=s=320x180:r=60:d=6" -filter_complex "[0][1]overlay=x='mod(t*300\,1600)':y=40" -c:v libx264 -preset veryfast -profile:v high -pix_fmt yuv420p -g 60 -b:v 8M "$p\pruebas\1080p\$c.mp4"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $src4k = @('-f','lavfi','-i','color=c=0x4868D0:s=3840x2160:r=60:d=6','-f','lavfi','-i','testsrc2=s=640x360:r=60:d=6','-filter_complex',"[0][1]overlay=x='mod(t*600\,3200)':y=80")
          & $ff -hide_banner -loglevel error -y @src4k -c:v libx264 -preset ultrafast -profile:v high -level 5.2 -pix_fmt yuv420p -g 60 -b:v 40M "$p\pruebas\4k-h264.mp4"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $ff -hide_banner -loglevel error -y @src4k -c:v libx265 -preset ultrafast -pix_fmt yuv420p -tag:v hvc1 -g 60 -b:v 30M -x265-params log-level=error "$p\pruebas\4k-hevc.mp4"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Armar el paquete de la Prueba de hardware
        shell: pwsh
        run: |
          $p = "paquete\Otaconvert-Prueba-de-hardware"
          Copy-Item target\release\otaconvert-motor.exe "$p\Prueba de hardware.exe"
          Copy-Item target\release\libmpv-2.dll, target\release\vulkan-1.dll, target\release\VulkanRT-Licencia.txt $p
          Copy-Item prueba-hardware\LEEME.txt $p
          Get-ChildItem -Recurse $p | Select-Object FullName, Length

      # El equipo de GitHub no tiene tarjeta gráfica ni tarjeta de sonido:
      # partes de la prueba fallan aquí. Se ejecuta para comprobar que el
      # orquestador y el informe funcionan; la que manda es la del equipo real.
      - name: Prueba de hardware (informativa)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = "paquete\Otaconvert-Prueba-de-hardware"
          & "$p\Prueba de hardware.exe" --prueba-hardware --sin-pausa
          Remove-Item "$p\Informe-hardware-*.txt" -ErrorAction SilentlyContinue

      # Demo portable para probar en un teatro: doble clic en Otaconvert.exe
      # abre el "Show de ejemplo"; arrastrar una carpeta con medios arma un show.
      # Los medios del ejemplo se generan aquí con FFmpeg (sonidos suaves, un
      # vídeo con sonido y una imagen): no hay archivos de terceros.
      - name: Armar la demo portable
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $d = "demo\Otaconvert-Demo-$ver"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target\release\otaconvert-motor.exe "$d\Otaconvert.exe"
          Copy-Item target\release\otaconvert-motor.exe "$d\Prueba de hardware.exe"
          Copy-Item target\release\otaconvert-ventana.exe, target\release\libmpv-2.dll, target\release\vulkan-1.dll, target\release\VulkanRT-Licencia.txt, target\release\LICENSE-EXCEPTION-WEBVIEW2.txt $d
          Copy-Item ..\LICENSE "$d\LICENSE.txt"
          Copy-Item manual\manual-usuario.pdf "$d\Manual de usuario.pdf"
          Copy-Item demo-portable\LEEME.txt $d
          Set-Content -Encoding utf8 "$d\portable.txt" "Versión portable: los ajustes se guardan en la carpeta datos, junto al programa."
          Copy-Item -Recurse paquete\Otaconvert-Prueba-de-hardware\pruebas "$d\pruebas"
          $s = "$d\Show de ejemplo"
          & "$d\Otaconvert.exe" --show-ejemplo $s
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$s\audio", "$s\video", "$s\imagen" | Out-Null
          $ff = "ff\ffmpeg.exe"
          $q = @('-hide_banner', '-loglevel', 'error', '-y')
          & $ff @q -f lavfi -i "aevalsrc=0.08*(sin(2*PI*220*t)+sin(2*PI*277*t)+sin(2*PI*330*t)):s=48000:d=8" -ac 2 -c:a libmp3lame -b:a 192k "$s\audio\sala.mp3"
          & $ff @q -f lavfi -i "anoisesrc=color=pink:amplitude=0.08:d=6:r=48000" -af "lowpass=f=900,afade=t=in:d=1,afade=t=out:st=5:d=1" -ac 2 "$s\audio\viento.wav"
          & $ff @q -f lavfi -i "aevalsrc=0.3*sin(2*PI*880*t)*exp(-1.5*t)+0.2*sin(2*PI*1320*t)*exp(-2*t):s=48000:d=4" -ac 2 "$s\audio\campanas.flac"
          & $ff @q -f lavfi -i "anoisesrc=color=white:amplitude=0.05:d=5:r=48000" -af "afade=t=in:d=0.5,afade=t=out:st=4:d=1" -ac 2 "$s\audio\final.wav"
          & $ff @q -f lavfi -i "anoisesrc=color=white:amplitude=0.05:d=3:r=48000" -af "afade=t=out:st=2:d=1" -ac 2 "$s\audio\aplausos.wav"
          & $ff @q -f lavfi -i "anoisesrc=color=brown:amplitude=0.2:d=3:r=48000" -af "afade=t=out:st=1:d=2" -ac 2 "$s\audio\trueno.wav"
          & $ff @q -f lavfi -i "testsrc2=s=1920x1080:r=30:d=12" -f lavfi -i "aevalsrc=0.1*sin(2*PI*440*t):s=48000:d=12" -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 128k -ac 2 -shortest "$s\video\luna.mp4"
          & $ff @q -f lavfi -i "smptehdbars=s=1920x1080" -frames:v 1 "$s\imagen\mapa.png"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$d\Otaconvert.exe" --version
          Get-ChildItem -Recurse $d -File | Select-Object @{n='Archivo';e={$_.FullName.Substring((Resolve-Path $d).Path.Length)}}, Length | Format-Table -AutoSize | Out-String -Width 200
          "Tamaño total: {0:N1} MB" -f ((Get-ChildItem -Recurse $d -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Huella SHA-256 (para comprobar descargas)
        shell: pwsh
        run: Get-FileHash target\release\otaconvert-motor.exe, target\release\otaconvert-ventana.exe, target\release\libmpv-2.dll, target\release\vulkan-1.dll -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Otaconvert-V2-motor
          path: |
            v2/target/release/otaconvert-motor.exe
            v2/target/release/otaconvert-ventana.exe
            v2/target/release/LICENSE-EXCEPTION-WEBVIEW2.txt
            v2/target/release/libmpv-2.dll
            v2/target/release/vulkan-1.dll
            v2/target/release/VulkanRT-Licencia.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Otaconvert-Prueba-de-hardware
          path: v2/paquete/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Otaconvert-Demo-portable
          path: v2/demo/

  vulnerabilidades:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked

      # Compara Cargo.lock con la base de avisos de seguridad de Rust (RustSec).
      # Falla si alguna librería tiene una vulnerabilidad conocida.
      # Excepciones (las dos son de la parte Linux de tao/wry, que Otaconvert
      # no compila nunca: solo hay versión para Windows):
      # - RUSTSEC-2024-0429: glib 0.18 (GTK, solo Linux).
      # - RUSTSEC-2024-0370: proc-macro-error sin mantenimiento (lo usa GTK, solo Linux).
      # El paso siguiente comprueba que de verdad no entran en Windows: si algún
      # día entraran, falla y hay que revisarlas.
      - name: Revisar librerías
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0370

      - name: Las excepciones no entran en la versión de Windows
        run: |
          rustup target add x86_64-pc-windows-msvc
          if cargo tree --locked --workspace --target x86_64-pc-windows-msvc -e normal,build | grep -E "glib|proc-macro-error"; then
            echo "glib o proc-macro-error entran en la versión de Windows: revisar las excepciones de cargo audit"
            exit 1
          fi
          echo "Bien: no entran en la versión de Windows"
